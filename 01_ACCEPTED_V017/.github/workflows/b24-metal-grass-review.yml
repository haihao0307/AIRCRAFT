name: B24 metal grass complete mission review
on:
  push:
    branches: [feature/b24-metal-grass-mission-r1-20260903]
    paths:
      - preview/b24-metal-grass-mission-r1/**
      - tools/qa-b24-metal-grass-r1.cjs
      - .github/workflows/b24-metal-grass-review.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: b24-metal-grass-review
  cancel-in-progress: true
jobs:
  browser-review:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract immutable aircraft payload from the current review page
        run: |
          mkdir -p preview/b24-metal-grass-mission-r1/assets
          curl -fL --retry 4 --output /tmp/current-review.html https://raw.githubusercontent.com/haihao0307/guilin-dem-pipeline/gh-pages/aircraft/b24-v016-recovery-review/index.html
          python3 - <<'PY'
          import base64,gzip,hashlib,re,json
          from pathlib import Path
          data=Path('/tmp/current-review.html').read_bytes()
          assert len(data)==12557938
          assert hashlib.sha256(data).hexdigest()=='7cf4c78cea99f9bf3aed5507cbcb2bdb49a71465b3c4aabc29563214f3da2fde'
          root=Path('preview/b24-metal-grass-mission-r1/assets')
          for token,name in [('manifestGzipBase64','native.json.gz'),('payloadGzipBase64','native.bin.gz')]:
              match=re.search(token.encode()+rb':"([A-Za-z0-9+/=]+)"',data)
              assert match, token
              (root/name).write_bytes(base64.b64decode(match.group(1)))
          payload=gzip.decompress((root/'native.bin.gz').read_bytes())
          assert len(payload)==16647376
          assert hashlib.sha256(payload).hexdigest()=='7ba1b923844f5161911e9aa63b18191e0d08ff8de4b3750204aa544320bd34c2'
          manifest=json.loads(gzip.decompress((root/'native.json.gz').read_bytes()))
          assert len(manifest['components'])==1784 and len(manifest['meshes'])==348
          print('Exact current-review geometry and animation payload verified.')
          PY
      - name: Install pinned local renderer and browser
        run: |
          npm install --no-save --no-package-lock three@0.180.0 playwright@1.55.0
          root=preview/b24-metal-grass-mission-r1
          mkdir -p "$root/vendor"
          cp node_modules/three/build/three.module.js node_modules/three/build/three.core.js "$root/vendor/"
          cp node_modules/three/examples/jsm/controls/OrbitControls.js "$root/vendor/"
          cp node_modules/three/LICENSE "$root/vendor/THREE-LICENSE.txt"
          npx playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Syntax check and browser mission review
        run: |
          for f in preview/b24-metal-grass-mission-r1/*.js; do node --check "$f"; done
          node --check tools/qa-b24-metal-grass-r1.cjs
          mkdir -p evidence
          python3 -m http.server 8765 --bind 127.0.0.1 --directory preview/b24-metal-grass-mission-r1 >/tmp/b24-server.log 2>&1 &
          SERVER=$!
          trap 'kill "$SERVER" || true' EXIT
          sleep 1
          TEST_URL=http://127.0.0.1:8765/ EVIDENCE_DIR=evidence node tools/qa-b24-metal-grass-r1.cjs
      - name: Create reproducible payload manifest
        if: always()
        env:
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('preview/b24-metal-grass-mission-r1')
          files={str(p.relative_to(root)):{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in root.rglob('*') if p.is_file()}
          report_path=Path('evidence/browser-report.json')
          qa=json.loads(report_path.read_text()) if report_path.exists() else {'status':'NOT_COMPLETED'}
          out={'build':'B24_METAL_GRASS_MISSION_R1','commit':os.environ['BUILD_COMMIT'],'files':files,'browserStatus':qa['status'],'sourceReviewFile':'B24_V012_PROPELLER_INTERFACE_REVIEW.html','sourceReviewSHA256':'7cf4c78cea99f9bf3aed5507cbcb2bdb49a71465b3c4aabc29563214f3da2fde','sourcePayloadSHA256':'7ba1b923844f5161911e9aa63b18191e0d08ff8de4b3750204aa544320bd34c2','exactV016Recovered':False,'weatherIntegrated':False,'newMountains':False,'visualAcceptance':False,'productionReady':False}
          (root/'BUILD_MANIFEST.json').write_text(json.dumps(out,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b24-metal-grass-review-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            evidence/
            preview/b24-metal-grass-mission-r1/
            tools/qa-b24-metal-grass-r1.cjs
