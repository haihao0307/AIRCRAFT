name: Build and publish B24 Metal Grass R1 full handoff

on:
  push:
    branches:
      - feature/b24-metal-grass-mission-r1-20260903
    paths:
      - '.github/workflows/b24-metal-grass-full-handoff.yml'
      - 'handoff/2026-09-03-b24-metal-grass-mission-r1-full/**'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: b24-metal-grass-r1-full-handoff
  cancel-in-progress: false

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUNTIME_COMMIT: 8ea0a34d016c46570e3916e37f587b2c7fb14ccf
      QA_RUN_ID: 33733439863
      QA_ARTIFACT_ID: 9884964353
      QA_ARTIFACT_BYTES: 16014875
      QA_ARTIFACT_SHA256: 94dd9f4bae178f3986999510e67bb83f97d8dd4c927d72eae3240639033e5d3e
      NATIVE_PAYLOAD_SHA256: 7ba1b923844f5161911e9aa63b18191e0d08ff8de4b3750204aa544320bd34c2
      HANDOFF_DIR: handoff/2026-09-03-b24-metal-grass-mission-r1-full
      PACKAGE_ROOT: AIRCRAFT_B24_METAL_GRASS_MISSION_R1_FULL_HANDOFF_2026-09-03
      PACKAGE_FILE: AIRCRAFT_B24_METAL_GRASS_MISSION_R1_FULL_HANDOFF_2026-09-03.zip
      RELEASE_TAG: b24-metal-grass-mission-r1-full-handoff-20260903
      PUBLIC_URL: https://haihao0307.github.io/guilin-dem-pipeline/aircraft/b24-metal-grass-mission-r1/

    steps:
      - name: Check out frozen handoff source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download the exact PASS 30/30 browser artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work package-out
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 2 \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H 'Accept: application/vnd.github+json' \
            -o work/browser-pass-artifact.zip \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${QA_ARTIFACT_ID}/zip"
          test "$(stat --format=%s work/browser-pass-artifact.zip)" = "$QA_ARTIFACT_BYTES"
          echo "$QA_ARTIFACT_SHA256  work/browser-pass-artifact.zip" | sha256sum --check
          unzip -q work/browser-pass-artifact.zip -d work/browser-pass-artifact

      - name: Validate the frozen runtime and browser evidence
        shell: bash
        run: |
          set -euo pipefail
          root=work/browser-pass-artifact
          test -s "$root/evidence/browser-report.json"
          test -s "$root/preview/b24-metal-grass-mission-r1/index.html"
          test -s "$root/preview/b24-metal-grass-mission-r1/assets/native.bin.gz"
          test -s "$root/preview/b24-metal-grass-mission-r1/assets/native.json.gz"
          test -s "$root/tools/qa-b24-metal-grass-r1.cjs"
          python3 - <<'PY'
          import gzip
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path('work/browser-pass-artifact')
          report = json.loads((root / 'evidence/browser-report.json').read_text(encoding='utf-8'))
          assert report['build'] == 'B24_METAL_GRASS_MISSION_R1'
          assert report['status'] == 'PASS'
          assert report['passed'] == 30
          assert report['total'] == 30
          assert report['visualAcceptance'] is False
          assert report['productionReady'] is False
          assert report['fullLoop']['time'] == 330
          assert report['fullLoop']['released'] == 4
          assert report['fullLoop']['impacts'] == 4
          assert report['fullLoop']['gear'] == 1
          assert report['fullLoop']['bay'] == 0
          assert report['fullLoop']['rpm'] == [0, 0, 0, 0]
          assert report['structure']['components'] == 1784
          assert report['structure']['meshes'] == 348
          assert [item['id'] for item in report['structure']['spindles']] == [1454, 1385, 1431, 1408]
          assert report['structure']['iframeCount'] == 0
          names = report['structure']['sceneNames']
          assert 'GRASS_AIRFIELD_SHARED_WORLD' in names
          assert not any('mountain' in str(name).lower() for name in names)

          payload_gz = root / 'preview/b24-metal-grass-mission-r1/assets/native.bin.gz'
          payload = gzip.decompress(payload_gz.read_bytes())
          assert hashlib.sha256(payload).hexdigest() == os.environ['NATIVE_PAYLOAD_SHA256']
          PY

      - name: Assemble the complete handoff directory
        shell: bash
        run: |
          set -euo pipefail
          root="work/$PACKAGE_ROOT"
          mkdir -p "$root/workbench" "$root/qa" "$root/source/tools" "$root/source/workflows" "$root/docs" "$root/delivery"
          cp -a work/browser-pass-artifact/preview/b24-metal-grass-mission-r1/. "$root/workbench/"
          cp -a work/browser-pass-artifact/evidence/. "$root/qa/"
          cp work/browser-pass-artifact/tools/qa-b24-metal-grass-r1.cjs "$root/source/tools/"
          cp .github/workflows/b24-metal-grass-review.yml "$root/source/workflows/"
          cp .github/workflows/b24-metal-grass-full-handoff.yml "$root/source/workflows/"
          cp "$HANDOFF_DIR/START_HERE.md" "$root/START_HERE.md"
          cp "$HANDOFF_DIR/HANDOFF.json" "$root/HANDOFF.json"
          cp AGENTS.md "$root/docs/AIRCRAFT_EXECUTION_MANUAL.md"
          printf '%s\n' "$PUBLIC_URL" > "$root/delivery/ONLINE_HTML_URL.txt"
          curl --fail --location --retry 6 --retry-all-errors --retry-delay 2 \
            -o "$root/delivery/ONLINE_REVIEW_MANIFEST.json" \
            "${PUBLIC_URL}ONLINE_REVIEW_MANIFEST.json?handoff=${GITHUB_SHA}"
          curl --fail --location --retry 6 --retry-all-errors --retry-delay 2 \
            -o "$root/delivery/LIVE_INDEX.html" \
            "${PUBLIC_URL}?handoff=${GITHUB_SHA}"
          grep -q '金属机身 · 草地机场' "$root/delivery/LIVE_INDEX.html"
          cat > "$root/docs/RESTART_PLAN.md" <<'EOF'
          # Clean restart plan

          New branch: `restart/b24-production-line-clean-r2-20260903`

          The branch starts from the frozen R1 handoff commit. The first task after restart is to inspect the directly clickable HTML and decide which existing components pass. A passed component is preserved as a real reusable asset and is not rebuilt during unrelated work.

          Weather remains paused at restart. The next implementation changes one requested component at a time and publishes a separate online HTML review path. Existing review pages remain available until the user accepts a replacement.
          EOF

      - name: Generate file manifest and deterministic ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import zipfile
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path('work') / os.environ['PACKAGE_ROOT']
          manifest_path = root / 'MANIFEST.json'
          files = {}
          for path in sorted(root.rglob('*')):
              if path.is_file() and path != manifest_path:
                  data = path.read_bytes()
                  files[str(path.relative_to(root))] = {
                      'bytes': len(data),
                      'sha256': hashlib.sha256(data).hexdigest(),
                  }
          manifest = {
              'schema': 'haihao.aircraft/b24-full-handoff-package-manifest@1.0.0',
              'handoffId': 'B24_METAL_GRASS_MISSION_R1_FULL_HANDOFF_2026-09-03',
              'generatedAt': datetime.now(timezone.utc).isoformat(),
              'handoffCommit': os.environ['GITHUB_SHA'],
              'runtimeCommit': os.environ['RUNTIME_COMMIT'],
              'qaRunId': int(os.environ['QA_RUN_ID']),
              'qaArtifactId': int(os.environ['QA_ARTIFACT_ID']),
              'qaArtifactSha256': os.environ['QA_ARTIFACT_SHA256'],
              'primaryOnlineHtml': os.environ['PUBLIC_URL'],
              'technicalBrowserVerification': 'PASS 30/30',
              'exactV016Recovered': False,
              'weatherIntegrated': False,
              'weaponsMotherIncluded': False,
              'img2threejsIncluded': False,
              'newMountains': False,
              'visualAcceptance': False,
              'productionReady': False,
              'files': files,
          }
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          checksum_lines = []
          for path in sorted(root.rglob('*')):
              if path.is_file():
                  checksum_lines.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.relative_to(root)}")
          (root / 'CHECKSUMS.sha256').write_text('\n'.join(checksum_lines) + '\n', encoding='utf-8')

          output = Path('package-out') / os.environ['PACKAGE_FILE']
          fixed = (2026, 9, 3, 9, 15, 0)
          with zipfile.ZipFile(output, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for path in sorted(root.rglob('*')):
                  if not path.is_file():
                      continue
                  arcname = str(Path(os.environ['PACKAGE_ROOT']) / path.relative_to(root))
                  info = zipfile.ZipInfo(arcname, fixed)
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = 0o100644 << 16
                  archive.writestr(info, path.read_bytes(), compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)
          package_bytes = output.read_bytes()
          package_sha = hashlib.sha256(package_bytes).hexdigest()
          (Path('package-out') / (os.environ['PACKAGE_FILE'] + '.sha256')).write_text(
              f"{package_sha}  {os.environ['PACKAGE_FILE']}\n", encoding='utf-8'
          )
          receipt = {
              'schema': 'haihao.aircraft/b24-full-handoff-release-receipt@1.0.0',
              'package': os.environ['PACKAGE_FILE'],
              'bytes': len(package_bytes),
              'sha256': package_sha,
              'releaseTag': os.environ['RELEASE_TAG'],
              'handoffCommit': os.environ['GITHUB_SHA'],
              'runtimeCommit': os.environ['RUNTIME_COMMIT'],
              'primaryOnlineHtml': os.environ['PUBLIC_URL'],
              'technicalBrowserVerification': 'PASS 30/30',
              'visualAcceptance': False,
              'productionReady': False,
          }
          (Path('package-out') / 'PACKAGE_RELEASE_RECEIPT.json').write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(receipt, ensure_ascii=False, indent=2))
          PY
          unzip -t "package-out/$PACKAGE_FILE"

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > package-out/RELEASE_NOTES.md <<EOF
          # B24 Metal Grass Mission R1 full handoff

          Frozen before the clean R2 restart.

          Online HTML: $PUBLIC_URL

          Technical browser evidence: PASS 30/30  
          Runtime source commit: $RUNTIME_COMMIT  
          Handoff commit: $GITHUB_SHA

          This release preserves the current workbench, native aircraft payload, same-origin renderer, complete mission sequence, synthesized sound, QA script, browser report, screenshots, execution manual and restart plan.

          The missing exact V016 HTML was not recovered. This release keeps that qualification explicit. Weather is not integrated. Weapons Mother, img2threejs, iframe composition and mountain scenery are excluded. User visual acceptance and production readiness remain false.
          EOF
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
              "package-out/$PACKAGE_FILE" \
              "package-out/$PACKAGE_FILE.sha256" \
              package-out/PACKAGE_RELEASE_RECEIPT.json
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title 'B24 Metal Grass Mission R1 Full Handoff 2026-09-03' \
              --notes-file package-out/RELEASE_NOTES.md
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title 'B24 Metal Grass Mission R1 Full Handoff 2026-09-03' \
              --notes-file package-out/RELEASE_NOTES.md \
              "package-out/$PACKAGE_FILE" \
              "package-out/$PACKAGE_FILE.sha256" \
              package-out/PACKAGE_RELEASE_RECEIPT.json
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url,tagName,name,assets > package-out/GITHUB_RELEASE.json
          cat package-out/GITHUB_RELEASE.json

      - name: Upload package as Actions evidence
        uses: actions/upload-artifact@v4
        with:
          name: b24-metal-grass-r1-full-handoff-${{ github.sha }}
          retention-days: 90
          if-no-files-found: error
          path: |
            package-out/AIRCRAFT_B24_METAL_GRASS_MISSION_R1_FULL_HANDOFF_2026-09-03.zip
            package-out/AIRCRAFT_B24_METAL_GRASS_MISSION_R1_FULL_HANDOFF_2026-09-03.zip.sha256
            package-out/PACKAGE_RELEASE_RECEIPT.json
            package-out/GITHUB_RELEASE.json

      - name: Summary
        shell: bash
        run: |
          {
            echo '## B24 full handoff package published'
            echo
            echo "Release tag: $RELEASE_TAG"
            echo "Package: $PACKAGE_FILE"
            echo "Primary online HTML: $PUBLIC_URL"
            echo 'Technical browser verification: PASS 30/30'
            echo 'Exact V016 recovered: false'
            echo 'Weather integrated: false'
            echo 'visualAcceptance=false'
            echo 'productionReady=false'
          } >> "$GITHUB_STEP_SUMMARY"
