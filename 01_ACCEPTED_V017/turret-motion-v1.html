 const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
 const html=await new Response(stream).text();
 if(!html.includes('B-24 腹部球形炮塔拆分与动画测试 v0.9.7')) throw new Error('测试站载荷校验失败。');
 const frame=document.createElement('iframe');
 frame.title='B-24 腹部球形炮塔拆分与动画测试 v0.9.7';
 frame.allow='fullscreen; clipboard-read; clipboard-write';
 frame.srcdoc=html;
 document.body.replaceChildren(frame);
}catch(error){
 document.getElementById('loading').innerHTML=`<strong>测试站启动失败</strong><p>${String(error.message||error)}</p>`;
 console.error(error);
}
})();
