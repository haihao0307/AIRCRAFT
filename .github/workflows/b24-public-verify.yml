name: B24 public page verification
on:
  push:
    branches: [feature/b24-v017-clean-restart-workbench]
    paths:
      - 'tools/public_qa.py'
      - '.github/workflows/b24-public-verify.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  public:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Browser prerequisites
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Verify published bytes and actual browser controls
        run: python tools/public_qa.py
      - name: Preserve public checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B24-public-checks
          path: |
            reports/PUBLIC_QA.json
            reports/public-*.png
      - name: Record successful public verification
        if: success()
        run: |
          git config user.name 'B24 verification'
          git config user.email 'b24-verification@users.noreply.github.com'
          git add reports/PUBLIC_QA.json reports/public-*.png
          git diff --cached --quiet || git commit -m 'test(b24): retain deployed-byte and public-browser evidence'
          git push origin HEAD:feature/b24-v017-clean-restart-workbench
