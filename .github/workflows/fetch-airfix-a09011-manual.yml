name: Fetch Airfix A09011 manual

on:
  push:
    branches:
      - ops/airfix-a09011-manual-fetch-20260830
    paths:
      - .github/workflows/fetch-airfix-a09011-manual.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Locate and download the Scalemates instructions PDF
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p out debug
          python -m pip install --disable-pip-version-check --quiet requests beautifulsoup4 playwright pypdf

          cat > /tmp/fetch_manual.py <<'PY'
          from __future__ import annotations

          import concurrent.futures
          import hashlib
          import html
          import json
          import os
          import re
          import subprocess
          import sys
          import time
          from pathlib import Path
          from urllib.parse import urljoin

          import requests
          from bs4 import BeautifulSoup
          from pypdf import PdfReader

          PAGE_URL = "https://www.scalemates.com/kits/airfix-a09011-consolidated-b-24d-liberator--1594516?utm_source=chatgpt.com"
          OUT = Path("out")
          DEBUG = Path("debug")
          OUT.mkdir(exist_ok=True)
          DEBUG.mkdir(exist_ok=True)

          UA = (
              "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
              "AppleWebKit/537.36 (KHTML, like Gecko) "
              "Chrome/151.0.0.0 Safari/537.36"
          )
          BASE_HEADERS = {
              "User-Agent": UA,
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8",
              "Accept-Language": "en-US,en;q=0.9",
              "Referer": "https://www.scalemates.com/",
              "Cache-Control": "no-cache",
          }

          report: dict[str, object] = {
              "requested_page": PAGE_URL,
              "expected_listing_size_kb": 15884,
              "attempts": [],
              "candidate_urls": [],
              "downloads": [],
          }

          def record_attempt(kind: str, url: str, status: object, detail: str = "") -> None:
              report["attempts"].append({"kind": kind, "url": url, "status": status, "detail": detail})

          def fetch_page(url: str, filename: str) -> str:
              try:
                  r = requests.get(url, headers=BASE_HEADERS, timeout=45, allow_redirects=True)
                  record_attempt("page", url, r.status_code, f"final={r.url}; bytes={len(r.content)}")
                  Path(filename).write_bytes(r.content)
                  if r.ok:
                      return r.text
              except Exception as exc:
                  record_attempt("page", url, "error", repr(exc))
              return ""

          page_texts: list[str] = []
          page_variants = [
              PAGE_URL,
              PAGE_URL.split("?", 1)[0],
              PAGE_URL.replace("/kits/", "/fr/kits/").split("?", 1)[0],
              PAGE_URL.replace("/kits/", "/de/kits/").split("?", 1)[0],
              "https://r.jina.ai/http://www.scalemates.com/kits/airfix-a09011-consolidated-b-24d-liberator--1594516",
              "https://r.jina.ai/https://www.scalemates.com/kits/airfix-a09011-consolidated-b-24d-liberator--1594516",
          ]
          for index, url in enumerate(page_variants):
              text = fetch_page(url, f"debug/page_{index}.html")
              if text:
                  page_texts.append(text)

          # Try a rendered browser view. GitHub hosted runners normally have Chrome installed.
          try:
              from playwright.sync_api import sync_playwright

              with sync_playwright() as p:
                  browser = p.chromium.launch(channel="chrome", headless=True)
                  context = browser.new_context(user_agent=UA, locale="en-US")
                  page = context.new_page()
                  response = page.goto(PAGE_URL, wait_until="domcontentloaded", timeout=90000)
                  page.wait_for_timeout(6000)
                  content = page.content()
                  DEBUG.joinpath("page_playwright.html").write_text(content, encoding="utf-8")
                  page_texts.append(content)
                  record_attempt(
                      "playwright",
                      PAGE_URL,
                      response.status if response else "no-response",
                      f"title={page.title()!r}; bytes={len(content.encode('utf-8'))}",
                  )
                  browser.close()
          except Exception as exc:
              record_attempt("playwright", PAGE_URL, "error", repr(exc))

          candidates: list[tuple[str, str]] = []
          seen: set[str] = set()

          def add_candidate(url: str, reason: str) -> None:
              url = html.unescape(url.strip().strip("'\"<>"))
              if url.startswith("//"):
                  url = "https:" + url
              elif url.startswith("/"):
                  url = urljoin("https://www.scalemates.com", url)
              if not url.lower().endswith(".pdf"):
                  return
              if url not in seen:
                  seen.add(url)
                  candidates.append((url, reason))

          url_patterns = [
              r"https?://[^\s\"'<>]+instructions\.pdf",
              r"/products/img/[^\s\"'<>]+instructions\.pdf",
              r"[\w./:-]+1594516-\d{2}-instructions\.pdf",
          ]
          for text in page_texts:
              for pattern in url_patterns:
                  for match in re.findall(pattern, text, flags=re.IGNORECASE):
                      add_candidate(match, "page-source")
              try:
                  soup = BeautifulSoup(text, "html.parser")
                  for node in soup.select("a[href]"):
                      href = node.get("href", "")
                      if "instructions" in href.lower() and ".pdf" in href.lower():
                          add_candidate(urljoin(PAGE_URL, href), "page-anchor")
              except Exception:
                  pass

          # Scalemates stores product files under the reversed final three digits and a two-digit upload suffix.
          for suffix in range(100):
              add_candidate(
                  f"https://www.scalemates.com/products/img/5/1/6/1594516-{suffix:02d}-instructions.pdf",
                  "scalemates-id-bruteforce",
              )

          # The retailer mirror currently attached to A09011 points to the parent A09010 manual.
          # Keep it as a separately labelled fallback and verify its title and exact size before use.
          add_candidate(
              "https://www.scalemates.com/products/img/2/4/2/1523742-46-instructions.pdf",
              "parent-manual-fallback-scalemates",
          )
          add_candidate(
              "https://d37tikmwcb2tc.cloudfront.net/plastic_models/file_attachment/1523742-46-instructions.pdf",
              "parent-manual-fallback-retailer-mirror",
          )

          report["candidate_urls"] = [{"url": u, "reason": r} for u, r in candidates]

          def probe(item: tuple[str, str]) -> dict[str, object]:
              url, reason = item
              headers = dict(BASE_HEADERS)
              headers.update({"Range": "bytes=0-2047", "Accept": "application/pdf,*/*;q=0.8"})
              try:
                  r = requests.get(url, headers=headers, timeout=25, allow_redirects=True, stream=True)
                  first = b""
                  for chunk in r.iter_content(chunk_size=2048):
                      first += chunk
                      if len(first) >= 2048:
                          break
                  content_type = r.headers.get("content-type", "")
                  content_range = r.headers.get("content-range", "")
                  content_length = r.headers.get("content-length", "")
                  is_pdf = first.startswith(b"%PDF") or "application/pdf" in content_type.lower()
                  return {
                      "url": url,
                      "reason": reason,
                      "status": r.status_code,
                      "final_url": r.url,
                      "content_type": content_type,
                      "content_range": content_range,
                      "content_length": content_length,
                      "first_hex": first[:16].hex(),
                      "is_pdf": is_pdf and r.status_code in (200, 206),
                  }
              except Exception as exc:
                  return {"url": url, "reason": reason, "status": "error", "error": repr(exc), "is_pdf": False}

          # Probe page-derived candidates first, then brute-force candidates in parallel.
          prioritized = sorted(candidates, key=lambda item: 0 if item[1].startswith("page") else 1 if "1594516" in item[0] else 2)
          probe_results: list[dict[str, object]] = []
          with concurrent.futures.ThreadPoolExecutor(max_workers=16) as executor:
              for result in executor.map(probe, prioritized):
                  probe_results.append(result)
          report["probe_results"] = probe_results
          DEBUG.joinpath("probe_results.json").write_text(json.dumps(probe_results, indent=2), encoding="utf-8")

          valid = [r for r in probe_results if r.get("is_pdf")]
          valid.sort(
              key=lambda r: (
                  0 if "1594516" in str(r.get("url")) else 1,
                  0 if str(r.get("reason", "")).startswith("page") else 1,
                  str(r.get("url")),
              )
          )

          if not valid:
              report["final_status"] = "NO_PDF_CANDIDATE_FOUND"
              Path("out/fetch_report.json").write_text(json.dumps(report, indent=2), encoding="utf-8")
              print(json.dumps(report, indent=2))
              sys.exit(2)

          def extract_first_page_text(path: Path) -> tuple[int, str]:
              try:
                  reader = PdfReader(str(path))
                  pages = len(reader.pages)
                  text = reader.pages[0].extract_text() or ""
                  return pages, text[:8000]
              except Exception as exc:
                  return 0, f"PDF_READ_ERROR: {exc!r}"

          downloaded_hashes: set[str] = set()
          selected: dict[str, object] | None = None
          for rank, candidate in enumerate(valid):
              url = str(candidate["url"])
              reason = str(candidate["reason"])
              try:
                  r = requests.get(url, headers={**BASE_HEADERS, "Accept": "application/pdf,*/*"}, timeout=120, allow_redirects=True)
                  r.raise_for_status()
                  data = r.content
                  if not data.startswith(b"%PDF"):
                      continue
                  sha256 = hashlib.sha256(data).hexdigest()
                  if sha256 in downloaded_hashes:
                      continue
                  downloaded_hashes.add(sha256)
                  temp_path = OUT / f"candidate_{rank:02d}.pdf"
                  temp_path.write_bytes(data)
                  pages, first_text = extract_first_page_text(temp_path)
                  entry = {
                      "url": url,
                      "reason": reason,
                      "final_url": r.url,
                      "bytes": len(data),
                      "kib": round(len(data) / 1024, 3),
                      "sha256": sha256,
                      "pages": pages,
                      "first_page_text": first_text,
                  }
                  report["downloads"].append(entry)

                  is_exact_size = abs(len(data) / 1024 - 15884) <= 2
                  first_upper = first_text.upper()
                  is_a09011 = "A09011" in first_upper or "B-24D" in first_upper
                  is_a09010 = "A09010" in first_upper or "B-24H" in first_upper
                  entry["matches_listing_size"] = is_exact_size
                  entry["first_page_identifies_a09011_or_b24d"] = is_a09011
                  entry["first_page_identifies_a09010_or_b24h"] = is_a09010

                  if selected is None and ("1594516" in url or is_a09011):
                      selected = entry
                      final_path = OUT / "Airfix_A09011_Consolidated_B-24D_Liberator_Instructions_Scalemates_1594516.pdf"
                      final_path.write_bytes(data)
                  elif selected is None and is_exact_size:
                      selected = entry
                      final_path = OUT / "Scalemates_A09011_Page_15884KB_Instructions_Download.pdf"
                      final_path.write_bytes(data)
              except Exception as exc:
                  record_attempt("download", url, "error", repr(exc))

          if selected is None and report["downloads"]:
              selected = report["downloads"][0]
              source_sha = str(selected["sha256"])
              for path in OUT.glob("candidate_*.pdf"):
                  if hashlib.sha256(path.read_bytes()).hexdigest() == source_sha:
                      (OUT / "Scalemates_A09011_Page_Instructions_Download.pdf").write_bytes(path.read_bytes())
                      break

          report["selected"] = selected
          report["final_status"] = "PDF_DOWNLOADED" if selected else "PDF_DOWNLOAD_FAILED"
          Path("out/fetch_report.json").write_text(json.dumps(report, indent=2), encoding="utf-8")
          print(json.dumps(report, indent=2))
          if selected is None:
              sys.exit(3)
          PY

          python /tmp/fetch_manual.py

      - name: Inspect downloaded files
        if: always()
        shell: bash
        run: |
          set -u
          find out debug -maxdepth 2 -type f -printf '%p %s bytes\n' | sort || true
          for f in out/*.pdf; do
            [ -e "$f" ] || continue
            echo "FILE=$f"
            sha256sum "$f"
            file "$f"
            pdfinfo "$f" | sed -n '1,30p' || true
            pdftotext -f 1 -l 1 "$f" - | sed -n '1,30p' || true
          done

      - name: Upload PDF and provenance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: airfix-a09011-scalemates-manual-fetch
          path: |
            out/
            debug/
          if-no-files-found: error
          retention-days: 7
