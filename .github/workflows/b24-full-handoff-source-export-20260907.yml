name: B24 full handoff source export 20260907
on:
  push:
    branches: [handoff/b24-generic-skin-full-20260907]
    paths: [.github/workflows/b24-full-handoff-source-export-20260907.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Collect exact current source and provenance
        shell: bash
        run: |
          set -euo pipefail
          ROOT=B24_GENERIC_SKIN_REMOTE_SOURCE_2026-09-07
          mkdir -p "$ROOT"
          cp -a \
            b24-generic-skin-v1.html \
            b24-generic-skin-closed-doors-r1.html \
            b24-generic-skin-closed-doors-r2.html \
            b24-generic-skin-closed-doors-r3.html \
            b24-generic-skin-closed-doors-r4.html \
            b24-generic-skin-closed-doors-r5.html \
            b24-generic-skin-closed-doors-r6.html \
            runtime \
            docs/b24-generic-skin \
            B24_GENERIC_SKIN_START_HERE.md \
            CURRENT.json \
            NEXT_START_HERE.md \
            ACCEPTED_BASELINE.json \
            AGENTS.md \
            README.md \
            knowledge \
            reports \
            package.json \
            "$ROOT"/
          mkdir -p "$ROOT/workflows"
          cp -a .github/workflows/b24-generic-*.yml "$ROOT/workflows/" || true
          git rev-parse HEAD > "$ROOT/REMOTE_EXPORT_COMMIT.txt"
          git status --porcelain=v1 > "$ROOT/REMOTE_EXPORT_STATUS.txt"
          find "$ROOT" -type f -print0 | sort -z | xargs -0 sha256sum > "$ROOT/SHA256SUMS.txt"
          python - <<'PY'
          import json, pathlib, subprocess, datetime
          root=pathlib.Path('B24_GENERIC_SKIN_REMOTE_SOURCE_2026-09-07')
          files=[]
          for p in sorted(root.rglob('*')):
              if p.is_file(): files.append({'path':p.relative_to(root).as_posix(),'bytes':p.stat().st_size})
          data={
            'schema':'haihao.aircraft/b24-generic-skin-remote-export@1.0',
            'createdUtc':datetime.datetime.now(datetime.UTC).isoformat(),
            'repository':'haihao0307/AIRCRAFT',
            'branch':'handoff/b24-generic-skin-full-20260907',
            'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'sourceBranchParent':'feature/b24-generic-skin-closed-doors-v1',
            'latestImplementedWorkbench':'b24-generic-skin-closed-doors-r6.html',
            'latestImplementedContentCommit':'dd71ae1441b106aa275211cea84c5b0a464e3c9c',
            'latestValidationCommit':'c3aefc82bbe5bd0d03ca77ef8115d5eb7b7fdb0f',
            'visualAcceptance':False,
            'productionReady':False,
            'files':files,
          }
          (root/'REMOTE_EXPORT_MANIFEST.json').write_text(json.dumps(data,indent=2,ensure_ascii=False),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: b24-generic-skin-remote-source-20260907
          path: B24_GENERIC_SKIN_REMOTE_SOURCE_2026-09-07/
          retention-days: 30
          compression-level: 6
