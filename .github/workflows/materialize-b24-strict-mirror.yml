name: Materialize B24 strict mirror pipeline

on:
  push:
    branches:
      - research/b24-engineering-drawings-cad-v1
    paths:
      - '.bootstrap/b24-strict-mirror/**'
      - '.github/workflows/materialize-b24-strict-mirror.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Materialize verified strict-mirror files
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/b24-strict-mirror/part-*.b64 | LC_ALL=C tr -d '\n\r\t ' > /tmp/b24-strict-mirror.b64
          base64 --decode /tmp/b24-strict-mirror.b64 > /tmp/b24-strict-mirror.tar.xz
          echo "3f7c31d4dbd8c6e4f181dbde72257ec241875813e7e515009d84183f0b5a8749  /tmp/b24-strict-mirror.tar.xz" | sha256sum --check
          tar --extract --xz --file /tmp/b24-strict-mirror.tar.xz --directory .
          rm -rf .bootstrap/b24-strict-mirror
          rm -rf .bootstrap/b24-native-prototype-v1
          rm -f .github/workflows/bootstrap-b24-native-prototype-v1.yml
          rm -f .github/workflows/materialize-b24-strict-mirror.yml
      - name: Validate native and strict-mirror contracts
        run: |
          node scripts/validate-b24-native-contracts.mjs
          node scripts/validate-b24-reference-full-mirror.mjs
          node --check scripts/extract-b24-reference-full-mirror.mjs
          node --check scripts/validate-b24-reference-full-mirror.mjs
      - name: Commit the strict mirror pipeline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "feat: replace rough B24 prototype path with strict reference mirror"
          git push origin HEAD:research/b24-engineering-drawings-cad-v1
