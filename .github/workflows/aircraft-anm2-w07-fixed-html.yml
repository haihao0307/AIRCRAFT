name: Freeze Aircraft ANM2 W07 single HTML
on:
  push:
    branches: [feature/b24-weapons-mother-v1]
    paths:
      - production/aircraft-anm2/workbench/w07/**
      - .github/workflows/aircraft-anm2-w07-fixed-html.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aircraft-anm2-w07-fixed-html
  cancel-in-progress: false
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OUTPUT: production/aircraft-anm2/releases/w07/AIRCRAFT_B24_ANM2_W07_PROGRESS.html
      EXPECTED_SHA256: d8f3a04dbd55ffbb01bc63fda8106f135284fc09951fb434b3dacd8fb1550cfe
      EXPECTED_BYTES: '1420223'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/b24-weapons-mother-v1
          fetch-depth: 0
          sparse-checkout: |
            production/aircraft-anm2/workbench/w06
            production/aircraft-anm2/workbench/w07
            production/aircraft-anm2/releases/w07
            .github/workflows
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assemble reviewed W07 sources and fixed renderer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/w07-source /tmp/w07-vendor
          cp -r production/aircraft-anm2/workbench/w07 /tmp/w07-source
          cp production/aircraft-anm2/workbench/w06/fullgun.js /tmp/w07-source/fullgun.js
          cp production/aircraft-anm2/workbench/w06/surface.js /tmp/w07-source/surface.js
          mkdir -p /tmp/w07-vendor "$(dirname "$OUTPUT")"
          base=https://raw.githubusercontent.com/mrdoob/three.js/r170
          curl -fLsS --retry 2 "$base/build/three.module.js" -o /tmp/w07-vendor/three.module.js
          curl -fLsS --retry 2 "$base/examples/jsm/controls/OrbitControls.js" -o /tmp/w07-vendor/OrbitControls.js
          curl -fLsS --retry 2 "$base/LICENSE" -o /tmp/w07-vendor/THREE_LICENSE.txt
          python /tmp/w07-source/build.py --vendor /tmp/w07-vendor --output "$OUTPUT"
          node --check /tmp/w07-source/fullgun.js
          node --check /tmp/w07-source/surface.js
          node --check /tmp/w07-source/reference-reader.js
          node --check /tmp/w07-source/reference-view.js
          node --check /tmp/w07-source/app.js
          test "$(wc -c < "$OUTPUT")" = "$EXPECTED_BYTES"
          echo "$EXPECTED_SHA256  $OUTPUT" | sha256sum -c -
          python - <<'PY'
          import json, os
          from pathlib import Path
          receipt=json.loads(Path(os.environ['OUTPUT']).with_suffix('.receipt.json').read_text())
          assert receipt['sha256']==os.environ['EXPECTED_SHA256']
          assert receipt['bytes']==int(os.environ['EXPECTED_BYTES'])
          assert receipt['productMeshFiles']==0 and receipt['productRasterTextures']==0
          assert receipt['referenceEmbedded'] is False
          PY
      - name: Exercise the actual self-contained file
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          import json, os
          html=Path(os.environ['OUTPUT']).resolve().as_uri()
          result={'source':'actual generated single HTML','viewports':[]}
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--no-sandbox','--enable-unsafe-swiftshader','--use-angle=swiftshader','--disable-dev-shm-usage'])
              for label,w,h in [('desktop',1500,950),('mobile',390,844)]:
                  page=browser.new_page(viewport={'width':w,'height':h}); errors=[]
                  page.on('pageerror',lambda e,errors=errors:errors.append(str(e)))
                  page.on('console',lambda m,errors=errors:errors.append(m.text) if m.type=='error' else None)
                  page.goto(html,wait_until='load',timeout=90000)
                  page.wait_for_function('window.W07?.ready===true',timeout=90000)
                  a=page.evaluate('W07.audit()')
                  assert a['nativeParts']==7 and a['nativeMeshes']>100 and a['nativeTriangles']>20000
                  assert a['nativeGeometryUnchanged'] and a['projection']=='ortho' and a['fov']==28
                  assert a['productMeshFiles']==0 and a['productRasterTextures']==0 and a['referenceEmbedded'] is False
                  assert not a['errors'] and not errors
                  result['viewports'].append({'label':label,'size':[w,h],'passed':True,'errors':errors})
                  page.close()
              browser.close()
          Path('/tmp/w07-file-check.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit the immutable review file to the production branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUTPUT" "${OUTPUT%.html}.receipt.json"
          git diff --cached --name-only | tee /tmp/w07-release-paths.txt
          python - <<'PY'
          from pathlib import Path
          paths=Path('/tmp/w07-release-paths.txt').read_text().splitlines()
          assert paths and all(p.startswith('production/aircraft-anm2/releases/w07/') for p in paths)
          PY
          git diff --cached --quiet || git commit -m 'release(aircraft): freeze W07 single-file HTML for commit-pinned review'
          for i in 1 2 3; do
            git pull --rebase origin feature/b24-weapons-mother-v1
            git push origin HEAD:feature/b24-weapons-mother-v1 && break
            test "$i" != 3
          done
          git rev-parse HEAD | tee /tmp/W07_FIXED_COMMIT.txt
          sha256sum "$OUTPUT" > /tmp/W07_SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AIRCRAFT_ANM2_W07_FIXED_HTML_${{ github.sha }}
          path: |
            ${{ env.OUTPUT }}
            production/aircraft-anm2/releases/w07/AIRCRAFT_B24_ANM2_W07_PROGRESS.receipt.json
            /tmp/w07-file-check.json
            /tmp/W07_FIXED_COMMIT.txt
            /tmp/W07_SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error
