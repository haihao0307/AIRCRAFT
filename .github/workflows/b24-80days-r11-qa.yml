name: B24 80 DAYS R11 browser QA
on:
  push:
    branches: [feature/b24-80days-scan-calibration-r10]
    paths:
      - b24-80days-instance-r11.html
      - b24-80days-r11-review.html
      - runtime/b24-80days-instance-r11.js
      - runtime/80-days-r11-art-inline.js
      - .github/workflows/b24-80days-r11-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static check
        run: |
          node --check runtime/b24-80days-instance-r11.js
          node --check runtime/80-days-r11-art-inline.js
      - name: Install Chromium
        run: |
          python -m pip install playwright==1.55.0 pillow
          python -m playwright install --with-deps chromium
      - name: Serve
        run: python -m http.server 8765 >/tmp/r11-http.log 2>&1 &
      - name: Browser QA
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from playwright.sync_api import sync_playwright
          import json
          out=Path('reports/80-days-r11-qa');out.mkdir(parents=True,exist_ok=True)
          errors=[]
          with sync_playwright() as p:
              b=p.chromium.launch(headless=True)
              page=b.new_page(viewport={'width':1728,'height':960},device_scale_factor=1)
              page.on('console',lambda m: errors.append('console '+m.type+': '+m.text) if m.type=='error' else None)
              page.on('pageerror',lambda e: errors.append('pageerror: '+str(e)))
              page.goto('http://127.0.0.1:8765/b24-80days-r11-review.html',wait_until='domcontentloaded',timeout=30000)
              iframe=page.frame_locator('iframe')
              iframe.locator('#scene').wait_for(state='visible',timeout=30000)
              frame=page.frames[-1]
              frame.wait_for_function('() => window.__B24_80DAYS_R11__ || window.__B24_80DAYS_R11_ERROR__',timeout=90000)
              state=frame.evaluate('() => ({audit:window.__B24_80DAYS_R11__||null,error:window.__B24_80DAYS_R11_ERROR__||null,status:document.querySelector("#status")?.textContent,loading:getComputedStyle(document.querySelector("#loading")).display})')
              page.screenshot(path=str(out/'review.png'))
              frame.locator('button[data-view="port"]').click();page.wait_for_timeout(1200)
              page.screenshot(path=str(out/'port-review.png'))
              frame.locator('button[data-view="nose-port"]').click();page.wait_for_timeout(1200)
              page.screenshot(path=str(out/'nose-port-review.png'))
              Path(out/'state.json').write_text(json.dumps({'state':state,'errors':errors},ensure_ascii=False,indent=2),encoding='utf-8')
              b.close()
          assert not state['error'],state
          a=state['audit']
          assert a and a['mother']['modified'] is False,a
          assert a['sourceArtwork']['redrawn'] is False,a
          assert a['sourceArtwork']['logicalXRange'][0] <= -800,a
          assert a['windowFrames']['red'] is True and a['windowFrames']['glassTransparent'] is True,a
          assert a['windowFrames']['mode']=='forward-port-frame-bands',a['windowFrames']
          assert state['loading']=='none',state
          assert not errors,errors
          full=Image.open(out/'port-review.png').convert('RGB')
          im=full.crop((int(full.width*.38),0,full.width,full.height))
          im.save(out/'port.png')
          red=sum(1 for r,g,b in im.getdata() if r>65 and r>g*1.35 and r>b*1.15 and g<100)
          yellow=sum(1 for r,g,b in im.getdata() if r>120 and g>80 and r>b*1.7 and g>b*1.4)
          total=im.width*im.height
          Path(out/'pixel-check.txt').write_text(f'red={red}\nyellow={yellow}\nred_ratio={red/total:.6f}\nyellow_ratio={yellow/total:.6f}\n',encoding='utf-8')
          assert red/total>.004,(red,total)
          assert yellow>100,(yellow,total)
          print(json.dumps({'frameMode':a['windowFrames']['mode'],'red':red,'yellow':yellow},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b24-80days-r11-qa
          path: reports/80-days-r11-qa
          retention-days: 30
