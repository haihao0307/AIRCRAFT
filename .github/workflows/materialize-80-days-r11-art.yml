name: Materialize 80 DAYS R11 source-pixel composite
on:
  push:
    branches: [feature/b24-80days-scan-calibration-r10]
    paths:
      - .github/workflows/materialize-80-days-r11-art.yml
      - runtime/b24-80days-instance-r11.js
      - b24-80days-instance-r11.html
      - b24-80days-r11-review.html
      - assets/80-days-port-master/80-days-port-master.png
      - assets/80-days-port-master/mouth.png
      - assets/80-days-port-master/robby.png
      - assets/80-days-port-master/title.png
      - assets/80-days-port-master/dice.png
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/b24-80days-scan-calibration-r10
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - name: Build extended E04-space source-pixel composite
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageChops
          from pathlib import Path
          import base64, hashlib, json
          root=Path('.')
          assets=root/'assets/80-days-port-master'
          source=Image.open(assets/'80-days-port-master.png').convert('RGBA')
          mouth=Image.open(assets/'mouth.png').convert('RGBA')
          robby=Image.open(assets/'robby.png').convert('RGBA')
          title=Image.open(assets/'title.png').convert('RGBA')
          dice=Image.open(assets/'dice.png').convert('RGBA')
          logical_min_x=-800
          logical_max_x=2000
          width=logical_max_x-logical_min_x
          height=1243
          offset_x=-logical_min_x
          canvas=Image.new('RGBA',(width,height),(0,0,0,0))
          def place(im,xywh):
              x,y,w,h=xywh
              im=im.resize((w,h),Image.Resampling.LANCZOS)
              canvas.paste(im,(x+offset_x,y),im)
          # Retain the supplied artwork pixels. Uniform resize only; no replacement drawing.
          # The mouth is enlarged and extended forward while its rear tip remains under the dice area.
          place(mouth,(-650,455,2150,661))
          place(robby,(390,245,190,135))
          place(title,(840,150,1210,340))
          place(dice,(1180,575,535,262))
          # Circular-window / shark-eye source region, masked only to remove unrelated pixels.
          eye=source.crop((367,134,564,337))
          mask=Image.new('L',eye.size,0);d=ImageDraw.Draw(mask);d.ellipse((3,3,eye.width-4,eye.height-4),fill=255)
          eye.putalpha(ImageChops.multiply(eye.getchannel('A'),mask))
          place(eye,(700,145,215,220))
          # Mission-bomb silhouettes retain the supplied contours; colour follows the user's yellow reference.
          bombs=source.crop((535,88,1435,164))
          px=bombs.load()
          for yy in range(bombs.height):
              for xx in range(bombs.width):
                  r,g,b,a=px[xx,yy]
                  if a<8: continue
                  lum=(r*54+g*183+b*19)//256
                  colour=(82,58,9) if lum<28 else (239,190,30)
                  px[xx,yy]=(*colour,a)
          place(bombs,(930,72,950,82))
          # Six Japanese flags are retained directly from the supplied source sheet.
          flags=source.crop((1126,164,1424,214))
          place(flags,(1570,160,325,55))
          out=Path('/tmp/80-days-r11-e04-extended.png');canvas.save(out,optimize=True)
          data=out.read_bytes();sha=hashlib.sha256(data).hexdigest();b64=base64.b64encode(data).decode('ascii')
          Path('runtime/80-days-r11-art-inline.js').write_text(
              '// Generated from retained user-supplied source pixels. Do not redraw or substitute.\n'
              +f"export const R11_ART_SHA256='{sha}';\n"
              +f"export const R11_ART_MIN_X={logical_min_x};\n"
              +f"export const R11_ART_WIDTH={width};\n"
              +f"export const R11_ART_HEIGHT={height};\n"
              +f"export const R11_ART_DATA_URL='data:image/png;base64,{b64}';\n",encoding='utf-8')
          doc=Path('docs/80-days-r11');doc.mkdir(parents=True,exist_ok=True)
          (doc/'PLACEMENT.json').write_text(json.dumps({
            'schema':'haihao.aircraft/80-days-r11-placement@2',
            'sourceArtworkSHA256':'799e52d96a3427ef11272974a1f2a1318fa1d32102dce445e079691fe36c12c4',
            'referenceE04SHA256':'07439c42eac526d5a209a6bf767853302089099eda4df11128a0e8b56a6a81fa',
            'compositeSHA256':sha,'logicalXRange':[logical_min_x,logical_max_x],'pixelSize':[width,height],
            'components':{
              'mouth':[-650,455,2150,661],
              'robby':[390,245,190,135],
              'title':[840,150,1210,340],
              'dice':[1180,575,535,262],
              'eye':[700,145,215,220],
              'bombs':[930,72,950,82],
              'japaneseFlags':[1570,160,325,55]
            },
            'constraints':{'motherGeometryModified':False,'glassRemainsTransparent':True,'redFrameShaderRegion':True,'visualAcceptance':False}
          },ensure_ascii=False,indent=2),encoding='utf-8')
          print('R11_ART_EXTENDED',len(data),sha)
          PY
      - name: Commit R11 exact source-pixel composite
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add runtime/80-days-r11-art-inline.js docs/80-days-r11/PLACEMENT.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(skin): extend R11 mouth forward and brighten mission marks"
          git push origin HEAD:feature/b24-80days-scan-calibration-r10
