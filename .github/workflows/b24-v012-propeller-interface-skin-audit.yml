name: B24 V012 propeller interface and skin audit

on:
  push:
    branches:
      - feature/b24-v012-propeller-interface-skin-audit
    paths:
      - 'handoff/2026-08-29-b24-v012-propeller-interface-skin-audit/**'
      - 'data/b24-native/surface-modules/B24_SOURCE_DRIVEN_WEATHERING_CONTRACT_V001.json'
      - 'docs/aircraft-pipeline/B24_V012_PROPELLER_INTERFACE_AND_SKIN_AUDIT.md'
      - 'tools/audit-b24-v012-propeller-skin.mjs'
      - 'tools/qa_b24_v012_propeller_interface.py'
      - '.github/workflows/b24-v012-propeller-interface-skin-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-and-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      V010_ROOT: handoff/2026-08-29-b24-v010-ridged-noise-v002/current_v010
      V012_ROOT: handoff/2026-08-29-b24-v012-propeller-interface-skin-audit
      DIST_ROOT: dist/AIRCRAFT_B24_V012_PROPELLER_INTERFACE_SKIN_AUDIT
      EVIDENCE_ROOT: dist/AIRCRAFT_B24_V012_PROPELLER_INTERFACE_SKIN_AUDIT/evidence
      PREVIEW_ROOT: dist/AIRCRAFT_B24_V012_PROPELLER_INTERFACE_SKIN_AUDIT/preview
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify frozen V010 and locked B24 inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(stat --format=%s "$V010_ROOT/B24_V010_RIDGED_LOCAL_DAMAGE_REVIEW.html")" = "12550988"
          echo '1b5b860ca78a7d55ea25d0d972a1d323125a57982d09452e7f7e0cb55d64a949  handoff/2026-08-29-b24-v010-ridged-noise-v002/current_v010/B24_V010_RIDGED_LOCAL_DAMAGE_REVIEW.html' | sha256sum --check
          test -f preview/b24-reference-exact/assets/chunks/manifest.json
          test -f "$V012_ROOT/B24_V012_PROPELLER_INTERFACE_PATCH.js"

      - name: Run source GLB, propeller and skin audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_ROOT/source"
          node tools/audit-b24-v012-propeller-skin.mjs \
            --output "$EVIDENCE_ROOT/source/B24_V012_PROPELLER_INTERFACE_SKIN_AUDIT.json"

      - name: Build V012 review HTML from exact V010
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PREVIEW_ROOT"
          python - <<'PY'
          import os
          from pathlib import Path

          source = Path(os.environ['V010_ROOT']) / 'B24_V010_RIDGED_LOCAL_DAMAGE_REVIEW.html'
          patch = Path(os.environ['V012_ROOT']) / 'B24_V012_PROPELLER_INTERFACE_PATCH.js'
          output = Path(os.environ['PREVIEW_ROOT']) / 'B24_V012_PROPELLER_INTERFACE_REVIEW.html'
          html = source.read_text(encoding='utf-8')
          patch_text = patch.read_text(encoding='utf-8')
          if '</body>' not in html:
              raise SystemExit('Frozen V010 HTML has no closing body tag')
          if '</head>' in html:
              html = html.replace('</head>', '<link rel="icon" href="data:,">\n</head>', 1)
          head, tail = html.rsplit('</body>', 1)
          generated = f'{head}<script>\n{patch_text}\n</script>\n</body>{tail}'
          output.write_text(generated, encoding='utf-8')
          if 'B24_V012_PROPELLER_INTERFACE_SKIN_AUDIT_2026-08-29' not in generated:
              raise SystemExit('V012 patch marker missing from generated HTML')
          print(f'generated={output} bytes={output.stat().st_size}')
          PY

      - name: Install pinned real-browser QA dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow==11.3.0 playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Start generated V012 preview
        shell: bash
        run: |
          set -euo pipefail
          cd "$PREVIEW_ROOT"
          python -m http.server 8772 --bind 127.0.0.1 > "$GITHUB_WORKSPACE/b24-v012-http.log" 2>&1 &
          echo $! > "$GITHUB_WORKSPACE/b24-v012-http.pid"
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8772/B24_V012_PROPELLER_INTERFACE_REVIEW.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$GITHUB_WORKSPACE/b24-v012-http.log"
          exit 1

      - name: Run V012 Chromium QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_ROOT/browser"
          xvfb-run -a python tools/qa_b24_v012_propeller_interface.py \
            --source-html "$V010_ROOT/B24_V010_RIDGED_LOCAL_DAMAGE_REVIEW.html" \
            --generated-html "$PREVIEW_ROOT/B24_V012_PROPELLER_INTERFACE_REVIEW.html" \
            --output "$EVIDENCE_ROOT/browser" \
            --url http://127.0.0.1:8772/B24_V012_PROPELLER_INTERFACE_REVIEW.html \
            | tee b24-v012-browser.log

      - name: Stop generated preview
        if: always()
        shell: bash
        run: |
          if [ -f b24-v012-http.pid ]; then
            kill "$(cat b24-v012-http.pid)" 2>/dev/null || true
          fi

      - name: Verify audit and browser evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = Path(os.environ['EVIDENCE_ROOT'])
          source = json.loads((evidence / 'source/B24_V012_PROPELLER_INTERFACE_SKIN_AUDIT.json').read_text(encoding='utf-8'))
          browser = json.loads((evidence / 'browser/B24_V012_PROPELLER_INTERFACE_BROWSER_QA.json').read_text(encoding='utf-8'))
          assert source['status'] == 'PASS_AUDIT_ONLY'
          assert source['propellerInterface']['sourceAssemblyCount'] == 4
          assert source['propellerInterface']['sourceConnectorPresentOnAllFour'] is True
          assert source['propellerInterface']['runtimeClassification']['rootCauseConfirmed'] is True
          assert browser['status'] == 'PASS_PREVIEW_ONLY'
          assert browser['totals']['failed'] == 0
          assert len(browser['connectorDetails']) == 4
          assert all(entry['triangleCount'] == 1128 for entry in browser['connectorDetails'])
          assert all(entry['alpha'] == 1 for entry in browser['connectorDetails'])
          assert all(entry['protectedFromRidged'] is True for entry in browser['connectorDetails'])
          assert browser['v012State']['sourcePayloadChanged'] is False
          assert browser['v012State']['geometryChanged'] is False
          assert browser['v012State']['animationChanged'] is False
          assert browser['v012State']['runwayFlightSequenceChanged'] is False
          assert browser['approvalBoundary'] == {
              'visualApproved': False,
              'surfaceSystemApproved': False,
              'historicalApproved': False,
              'engineeringApproved': False,
              'wholeAircraftApproved': False,
              'productionFrozen': False,
          }
          print('B24_V012_PROPELLER_INTERFACE_SKIN_AUDIT_PASS')
          PY
          echo '1b5b860ca78a7d55ea25d0d972a1d323125a57982d09452e7f7e0cb55d64a949  handoff/2026-08-29-b24-v010-ridged-noise-v002/current_v010/B24_V010_RIDGED_LOCAL_DAMAGE_REVIEW.html' | sha256sum --check

      - name: Run repository validation
        shell: bash
        run: |
          set -euo pipefail
          npm run validate:80days:references
          npm run build:80days:count-sheet
          npm test
          npm run build

      - name: Assemble V012 delivery
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DIST_ROOT/contracts" "$DIST_ROOT/docs" "$DIST_ROOT/records"
          cp "$V012_ROOT/B24_V012_PROPELLER_INTERFACE_PATCH.js" "$DIST_ROOT/contracts/"
          cp data/b24-native/surface-modules/B24_SOURCE_DRIVEN_WEATHERING_CONTRACT_V001.json "$DIST_ROOT/contracts/"
          cp docs/aircraft-pipeline/B24_V012_PROPELLER_INTERFACE_AND_SKIN_AUDIT.md "$DIST_ROOT/docs/"
          cp b24-v012-browser.log "$DIST_ROOT/records/" 2>/dev/null || true
          cp b24-v012-http.log "$DIST_ROOT/records/" 2>/dev/null || true
          cat > "$DIST_ROOT/README_FIRST.md" <<'EOF'
          # B24 V012 螺旋桨连接件与蒙皮来源审计

          直接打开：

          `preview/B24_V012_PROPELLER_INTERFACE_REVIEW.html`

          完整 B24 飞机保持主对象。V012 只恢复冻结源文件中已经存在的四个 1,128 三角形螺旋桨连接机构。源载荷、几何、动画、80 DAYS 涂装身份和跑道飞行动作系统均未修改。

          表面层合同位于 `contracts/B24_SOURCE_DRIVEN_WEATHERING_CONTRACT_V001.json`。噪波只承担来源遮罩内部的变化工具职责。

          所有视觉、表面、历史、工程、整机和生产批准继续关闭。
          EOF
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          out = Path(os.environ['DIST_ROOT'])
          source_report = out / 'evidence/source/B24_V012_PROPELLER_INTERFACE_SKIN_AUDIT.json'
          browser_report = out / 'evidence/browser/B24_V012_PROPELLER_INTERFACE_BROWSER_QA.json'
          source = json.loads(source_report.read_text(encoding='utf-8')) if source_report.exists() else None
          browser = json.loads(browser_report.read_text(encoding='utf-8')) if browser_report.exists() else None
          files = []
          for file_path in sorted(out.rglob('*')):
              if file_path.is_file():
                  data = file_path.read_bytes()
                  files.append({
                      'path': file_path.relative_to(out).as_posix(),
                      'bytes': len(data),
                      'sha256': hashlib.sha256(data).hexdigest(),
                  })
          receipt = {
              'schema': 'haihao.aircraft/b24-v012-propeller-interface-delivery@1.0.0',
              'repository': 'haihao0307/AIRCRAFT',
              'branch': os.environ.get('GITHUB_REF_NAME'),
              'commit': os.environ.get('GITHUB_SHA'),
              'status': 'PASS_PREVIEW_ONLY' if source and browser and source.get('status') == 'PASS_AUDIT_ONLY' and browser.get('status') == 'PASS_PREVIEW_ONLY' else 'FAILED_OR_INCOMPLETE',
              'sourceGlbSha256': '541c3dcfb98ab590cdb1bc90d6ddcdfe80bce2a4b937f3bccefab0c7efe8be0d',
              'sourceV010HtmlSha256': '1b5b860ca78a7d55ea25d0d972a1d323125a57982d09452e7f7e0cb55d64a949',
              'sourceConnectorPresentOnAllFour': source['propellerInterface']['sourceConnectorPresentOnAllFour'] if source else False,
              'connectorVisibleOnAllFour': bool(browser and len(browser.get('connectorDetails', [])) == 4 and all(entry.get('alpha') == 1 for entry in browser['connectorDetails'])),
              'sourcePayloadChanged': False,
              'geometryChanged': False,
              'animationChanged': False,
              'runwayFlightSequenceChanged': False,
              'productionApproved': False,
              'files': files,
          }
          (out / 'records/B24_V012_DELIVERY_RECEIPT.json').write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY
          find "$DIST_ROOT" -type f -print0 | sort -z | xargs -0 sha256sum > "$DIST_ROOT/records/SHA256SUMS.txt"
          cd dist
          zip -q -r -9 AIRCRAFT_B24_V012_PROPELLER_INTERFACE_SKIN_AUDIT.zip AIRCRAFT_B24_V012_PROPELLER_INTERFACE_SKIN_AUDIT
          sha256sum AIRCRAFT_B24_V012_PROPELLER_INTERFACE_SKIN_AUDIT.zip > AIRCRAFT_B24_V012_PROPELLER_INTERFACE_SKIN_AUDIT.zip.sha256

      - name: Upload V012 audit delivery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AIRCRAFT_B24_V012_PROPELLER_INTERFACE_SKIN_AUDIT-${{ github.sha }}
          path: |
            dist/AIRCRAFT_B24_V012_PROPELLER_INTERFACE_SKIN_AUDIT.zip
            dist/AIRCRAFT_B24_V012_PROPELLER_INTERFACE_SKIN_AUDIT.zip.sha256
            dist/AIRCRAFT_B24_V012_PROPELLER_INTERFACE_SKIN_AUDIT/preview/B24_V012_PROPELLER_INTERFACE_REVIEW.html
            dist/AIRCRAFT_B24_V012_PROPELLER_INTERFACE_SKIN_AUDIT/evidence/source/B24_V012_PROPELLER_INTERFACE_SKIN_AUDIT.json
            dist/AIRCRAFT_B24_V012_PROPELLER_INTERFACE_SKIN_AUDIT/evidence/browser/B24_V012_PROPELLER_INTERFACE_BROWSER_QA.json
            dist/AIRCRAFT_B24_V012_PROPELLER_INTERFACE_SKIN_AUDIT/evidence/browser/B24_V012_FULL_PAGE.png
            dist/AIRCRAFT_B24_V012_PROPELLER_INTERFACE_SKIN_AUDIT/evidence/browser/B24_V012_PROP0_HUB_CONNECTOR.png
            dist/AIRCRAFT_B24_V012_PROPELLER_INTERFACE_SKIN_AUDIT/evidence/browser/B24_V012_PROP1_HUB_CONNECTOR.png
            dist/AIRCRAFT_B24_V012_PROPELLER_INTERFACE_SKIN_AUDIT/evidence/browser/B24_V012_PROP2_HUB_CONNECTOR.png
            dist/AIRCRAFT_B24_V012_PROPELLER_INTERFACE_SKIN_AUDIT/evidence/browser/B24_V012_PROP3_HUB_CONNECTOR.png
            dist/AIRCRAFT_B24_V012_PROPELLER_INTERFACE_SKIN_AUDIT/records/B24_V012_DELIVERY_RECEIPT.json
          if-no-files-found: error
          retention-days: 90

      - name: Write V012 summary
        if: always()
        shell: bash
        run: |
          {
            echo '## B24 V012 propeller interface and skin audit'
            echo
            echo "Branch: $GITHUB_REF_NAME"
            echo
            echo "Commit: $GITHUB_SHA"
            echo
            echo 'Aircraft remains primary. Noise remains a subordinate local surface tool.'
            echo
            if [ -f "$EVIDENCE_ROOT/source/B24_V012_PROPELLER_INTERFACE_SKIN_AUDIT.json" ]; then
              python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ['EVIDENCE_ROOT']) / 'source/B24_V012_PROPELLER_INTERFACE_SKIN_AUDIT.json'
          r = json.loads(p.read_text(encoding='utf-8'))
          print(f"Source connectors present on all four: {r['propellerInterface']['sourceConnectorPresentOnAllFour']}")
          print(f"Source normalTexture count: {r['sourceSkinAndTextureInventory']['textureSlots']['slotCounts']['normalTexture']}")
          print(f"Semantic source-name matches: {r['sourceSkinAndTextureInventory']['semanticNames']['matchCount']}")
          PY
            fi
            echo
            if [ -f "$EVIDENCE_ROOT/browser/B24_V012_PROPELLER_INTERFACE_BROWSER_QA.json" ]; then
              python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ['EVIDENCE_ROOT']) / 'browser/B24_V012_PROPELLER_INTERFACE_BROWSER_QA.json'
          r = json.loads(p.read_text(encoding='utf-8'))
          print(f"Browser QA: {r['status']} {r['totals']}")
          PY
            fi
            echo
            if [ -f dist/AIRCRAFT_B24_V012_PROPELLER_INTERFACE_SKIN_AUDIT.zip.sha256 ]; then
              cat dist/AIRCRAFT_B24_V012_PROPELLER_INTERFACE_SKIN_AUDIT.zip.sha256
            fi
            echo
            echo 'All visual, surface, historical, engineering, whole-aircraft and production approvals remain false.'
          } >> "$GITHUB_STEP_SUMMARY"
