name: B24 80 DAYS window shape match QA
on:
  push:
    branches: [feature/b24-80days-registration-r7]
    paths:
      - b24-80days-window-shape-match.html
      - runtime/b24-80days-window-shape-match.js
      - .github/workflows/b24-80days-window-shape-match-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static check
        run: node --check runtime/b24-80days-window-shape-match.js
      - name: Install Chromium
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Serve
        run: python -m http.server 8765 >/tmp/shape-http.log 2>&1 &
      - name: Rank and capture top candidates
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from playwright.sync_api import sync_playwright
          out=Path('reports/80-days-window-shape-match');out.mkdir(parents=True,exist_ok=True)
          errors=[]
          with sync_playwright() as p:
              b=p.chromium.launch(headless=True)
              page=b.new_page(viewport={"width":1280,"height":860},device_scale_factor=1)
              page.on('console',lambda m: errors.append('console '+m.type+': '+m.text) if m.type=='error' else None)
              page.on('pageerror',lambda e: errors.append('pageerror: '+str(e)))
              page.goto('http://127.0.0.1:8765/b24-80days-window-shape-match.html',wait_until='domcontentloaded',timeout=30000)
              page.wait_for_function("() => window.__B24_WINDOW_SHAPE_MATCH__ || window.__B24_WINDOW_SHAPE_MATCH_ERROR__",timeout=60000)
              err=page.evaluate("() => window.__B24_WINDOW_SHAPE_MATCH_ERROR__||null")
              assert not err,err
              state=page.evaluate("() => window.__B24_WINDOW_SHAPE_MATCH__")
              Path(out/'ranking.json').write_text(json.dumps({'state':state,'errors':errors},ensure_ascii=False,indent=2),encoding='utf-8')
              for r in state['top'][:8]:
                  cid=r['component'];page.click(f'button[data-c="{cid}"]');page.wait_for_timeout(450);page.screenshot(path=str(out/f'rank-c{cid}.png'))
              b.close()
          assert state['componentTotal']==548,state
          assert state['candidateCount']>=20,state
          assert len(state['top'])>=8,state
          assert state['top'][0]['component'] in (8,81),state['top'][:3]
          assert state['top'][0]['score']>=state['top'][7]['score'],state
          assert not errors,errors
          print(json.dumps(state['top'][:12],ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b24-80days-window-shape-match
          path: reports/80-days-window-shape-match
          retention-days: 30
