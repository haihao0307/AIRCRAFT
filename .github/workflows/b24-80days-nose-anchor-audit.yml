name: B24 80 DAYS nose anchor audit
on:
  push:
    branches: [feature/b24-80days-instance-from-mother01-r3]
    paths:
      - b24-80days-nose-anchor-audit.html
      - runtime/b24-80days-nose-anchor-audit.js
      - .github/workflows/b24-80days-nose-anchor-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static check
        run: node --check runtime/b24-80days-nose-anchor-audit.js
      - name: Install Chromium
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Serve
        run: python -m http.server 8765 >/tmp/anchor-http.log 2>&1 &
      - name: Collect anchor audit
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from playwright.sync_api import sync_playwright
          out=Path('reports/80-days-nose-anchor');out.mkdir(parents=True,exist_ok=True)
          with sync_playwright() as p:
              b=p.chromium.launch(headless=True)
              page=b.new_page(viewport={"width":1440,"height":900})
              errors=[]
              page.on('console',lambda m: errors.append(m.text) if m.type=='error' else None)
              page.on('pageerror',lambda e: errors.append(str(e)))
              page.goto('http://127.0.0.1:8765/b24-80days-nose-anchor-audit.html',wait_until='domcontentloaded',timeout=30000)
              page.wait_for_function("() => window.__B24_NOSE_ANCHOR_AUDIT__ || window.__B24_NOSE_ANCHOR_ERROR__",timeout=60000)
              state=page.evaluate("() => ({audit:window.__B24_NOSE_ANCHOR_AUDIT__||null,error:window.__B24_NOSE_ANCHOR_ERROR__||null})")
              Path(out/'anchors.json').write_text(json.dumps({'state':state,'errors':errors},ensure_ascii=False,indent=2),encoding='utf-8')
              b.close()
          assert not state['error'],state
          a=state['audit']
          assert a['sourcePayloadSHA256']=='f5ff859a7ff0e38112fa099d8c7d3a4cd8e859434701fb4dd9d81629374c5e3e',a
          assert a['glassCount']>0,a
          assert not errors,errors
          print('candidateCount',a['candidateCount'],'glassCount',a['glassCount'])
          print('LIKELY_PORT_NOSE')
          print(json.dumps(a['likelyPortNose'],ensure_ascii=False,indent=2))
          print('NOSE_SKIN')
          print(json.dumps(a['noseSkin'],ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b24-80days-nose-anchor-audit
          path: reports/80-days-nose-anchor
          retention-days: 30