name: B24 80 DAYS instance R5 QA
on:
  push:
    branches: [feature/b24-80days-instance-from-mother01-r5]
    paths:
      - b24-80days-instance-r5.html
      - runtime/b24-80days-instance-r5.js
      - .github/workflows/b24-80days-instance-r5-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static check
        run: node --check runtime/b24-80days-instance-r5.js
      - name: Install Chromium
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Serve
        run: python -m http.server 8765 >/tmp/r5-http.log 2>&1 &
      - name: Browser geometry and fixed-view QA
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from playwright.sync_api import sync_playwright
          out=Path('reports/80-days-r5-qa');out.mkdir(parents=True,exist_ok=True)
          errors=[]
          with sync_playwright() as p:
              b=p.chromium.launch(headless=True)
              page=b.new_page(viewport={"width":1440,"height":900},device_scale_factor=1)
              page.on('console',lambda m: errors.append('console '+m.type+': '+m.text) if m.type=='error' else None)
              page.on('pageerror',lambda e: errors.append('pageerror: '+str(e)))
              page.goto('http://127.0.0.1:8765/b24-80days-instance-r5.html',wait_until='domcontentloaded',timeout=30000)
              page.wait_for_function("() => window.__B24_80DAYS_R5__ || window.__B24_80DAYS_R5_ERROR__",timeout=60000)
              state=page.evaluate("() => ({audit:window.__B24_80DAYS_R5__||null,error:window.__B24_80DAYS_R5_ERROR__||null,status:document.querySelector('#status')?.textContent,qa:document.querySelector('#qaReadout')?.textContent,loading:getComputedStyle(document.querySelector('#loading')).display})")
              for name in ['nose-port','port','front','orbit']:
                  page.click(f'button[data-view="{name}"]');page.wait_for_timeout(700);page.screenshot(path=str(out/f'{name}.png'))
              mobile=page.context.new_page()
              mobile.set_viewport_size({"width":390,"height":844})
              mobile.goto('http://127.0.0.1:8765/b24-80days-instance-r5.html',wait_until='domcontentloaded',timeout=30000)
              mobile.wait_for_function("() => window.__B24_80DAYS_R5__ || window.__B24_80DAYS_R5_ERROR__",timeout=60000)
              mobile.screenshot(path=str(out/'mobile-390x844.png'))
              Path(out/'state.json').write_text(json.dumps({'state':state,'errors':errors},ensure_ascii=False,indent=2),encoding='utf-8')
              b.close()
          assert not state['error'],state
          a=state['audit']
          assert a['mother']['id']=='b24-generic-mother-01' and a['mother']['modified'] is False,a
          assert a['anchor']['component']==69,a
          w,h=a['calibration']['physicalMouthRect']
          assert 1.6<w<1.85,(w,h)
          assert .40<h<.50,(w,h)
          assert .23<a['calibration']['shrinkRatio']<.29,a
          assert a['mapping']['mode']=='world-space skin shader projection',a
          assert a['mapping']['raycastDecalGeometry'] is False,a
          assert a['mapping']['glassAffected'] is False,a
          assert a['evidence']['teethRecovered']>=10,a
          assert a['startupMs']<60000,a['startupMs']
          assert a['visualAcceptance'] is False and a['productionReady'] is False,a
          assert state['loading']=='none',state
          assert not errors,errors
          print(json.dumps({'qa':state['qa'],'startupMs':a['startupMs'],'physicalMouthRect':a['calibration']['physicalMouthRect'],'bounds':a['calibration']['bounds'],'errors':errors},ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b24-80days-instance-r5-qa
          path: reports/80-days-r5-qa
          retention-days: 30
