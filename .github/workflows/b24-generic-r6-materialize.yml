name: B24 generic skin materialize R6
on:
  push:
    branches: [feature/b24-generic-skin-closed-doors-v1]
    paths: [.github/workflows/b24-generic-r6-materialize.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build R6 from audited R5
        shell: python
        run: |
          from pathlib import Path

          source=Path('runtime/b24-generic-skin-closed-doors-r5.js')
          target=Path('runtime/b24-generic-skin-closed-doors-r6.js')
          s=source.read_text()
          required=['function applySkinShader()','function makeInsigniaTexture()',"center:new THREE.Vector3(12.90,.35,-.15)","center:new THREE.Vector3(-9.55,.12,-.15)","axisV:new THREE.Vector3(0,0,-1)","center:new THREE.Vector3(1.10,-.34,-4.15)","window.__B24_GENERIC_R5__="]
          for token in required:
              if token not in s: raise SystemExit('missing expected R5 token: '+token)

          start=s.index('const horizontalLocalYSign=')
          end=s.index('function makeInsigniaTexture()',start)
          shader="""function applySkinShader(){for(const mesh of paintMeshes){const mat=mesh.material,node=mesh.userData.sourceNode;mat.color.set(0xffffff);mat.metalness=.02;mat.roughness=.76;mat.onBeforeCompile=shader=>{shader.uniforms.skinUpper={value:upper};shader.uniforms.skinLower={value:lower};shader.uniforms.fuselageSplit={value:split};shader.vertexShader='varying vec3 vSkinWorld;varying vec3 vSkinNormal;\\n'+shader.vertexShader.replace('#include <worldpos_vertex>','#include <worldpos_vertex>\\nvSkinWorld=(modelMatrix*vec4(transformed,1.0)).xyz;vSkinNormal=normalize(mat3(modelMatrix)*objectNormal);');shader.fragmentShader='uniform vec3 skinUpper;uniform vec3 skinLower;uniform float fuselageSplit;varying vec3 vSkinWorld;varying vec3 vSkinNormal;\\n'+shader.fragmentShader.replace('#include <color_fragment>','#include <color_fragment>\\nfloat ax=abs(vSkinWorld.x);float z=vSkinWorld.z;float upperWeight=smoothstep(fuselageSplit-.055,fuselageSplit+.055,vSkinWorld.y);float mainWing=step(1.35,ax)*step(-3.25,z)*step(z,1.55);if(mainWing>.5){float wingMid=0.15+0.035*max(ax-1.0,0.0);float edgeClass=smoothstep(wingMid-.045,wingMid+.045,vSkinWorld.y);float faceClass=smoothstep(-.12,.12,vSkinNormal.y);float horizontalness=smoothstep(.20,.48,abs(vSkinNormal.y));upperWeight=mix(edgeClass,faceClass,horizontalness);}float nacelle=step(1.55,ax)*step(ax,8.85)*step(1.45,z)*step(z,4.45);if(nacelle>.5){upperWeight=smoothstep(-.39,-.29,vSkinWorld.y);}if(z<-9.0&&ax>1.15){float horizontalness=smoothstep(.20,.48,abs(vSkinNormal.y));if(horizontalness>.01){float tailEdge=smoothstep(.27,.37,vSkinWorld.y);float tailFace=smoothstep(-.12,.12,vSkinNormal.y);upperWeight=mix(tailEdge,tailFace,horizontalness);}else{upperWeight=1.0;}}diffuseColor.rgb*=mix(skinLower,skinUpper,clamp(upperWeight,0.0,1.0));');};mat.customProgramCacheKey=()=>`b24-generic-r6-${node}-${split.toFixed(3)}`;mat.needsUpdate=true}}\n"""
          s=s[:start]+shader+s[end:]
          s=s.replace('center:new THREE.Vector3(12.90,.35,-.15)','center:new THREE.Vector3(12.40,.35,-.15)')
          s=s.replace('center:new THREE.Vector3(-9.55,.12,-.15)','center:new THREE.Vector3(-12.40,.35,-.15)')
          s=s.replace('axisV:new THREE.Vector3(0,0,-1),width:2.70,height:1.25','axisV:new THREE.Vector3(0,0,1),width:2.28,height:1.06')
          s=s.replace('center:new THREE.Vector3(1.10,-.34,-4.15)','center:new THREE.Vector3(1.10,-.40,-4.15)')
          s=s.replace('center:new THREE.Vector3(-1.10,-.34,-4.15)','center:new THREE.Vector3(-1.10,-.40,-4.15)')
          s=s.replace('window.__B24_GENERIC_R5__=','window.__B24_GENERIC_R6__=')
          old="placement:{upperWing:{center:[12.90,.35,-.15],sourceView:'top'},lowerWing:{center:[-9.55,.12,-.15],sourceView:'bottom',axisV:[0,0,-1]},fuselage:{centerZ:-4.15,centerY:-.34,doorTargetsExcluded:true}},shadows:false"
          new="placement:{upperWing:{center:[12.40,.35,-.15],sourceView:'top',noseDirection:[0,0,1]},lowerWing:{center:[-12.40,.35,-.15],sourceView:'bottom',noseDirection:[0,0,1]},fuselage:{centerZ:-4.15,centerY:-.40,doorTargetsExcluded:true}},paintClassifier:'world-facing upper/lower with nacelle and vertical-fin guards',shadows:false"
          if old not in s: raise SystemExit('R5 audit payload not found')
          s=s.replace(old,new)
          s=s.replace('军徽方向、位置与上下表修正 R5','军徽位置、方向与公版色区修正 R6')
          s=s.replace('if(window.__B24_GENERIC_R5__)window.__B24_GENERIC_R5__.split=split','if(window.__B24_GENERIC_R6__)window.__B24_GENERIC_R6__.split=split')
          target.write_text(s)

          h=Path('b24-generic-skin-closed-doors-r5.html').read_text()
          h=h.replace('通用军徽与色区 R5','通用军徽与色区 R6').replace('REFERENCE LOCKED · R5','REFERENCE LOCKED · R6')
          h=h.replace('generic-skin-closed-doors-r5','generic-skin-closed-doors-r6')
          h=h.replace('上翼军徽按上视图移到外翼；下翼军徽按下视图单独移回中外翼，并翻正星形方向。左右机身军徽移到机翼后方、腰部枪窗之前，只命中本侧外壳。','上翼和下翼军徽分别按原参考图恢复到外翼位置，星形单尖都朝机头。左右机身军徽位于机翼后方、腰部枪窗之前，只命中本侧外壳。')
          h=h.replace('水平蒙皮使用各源部件局部厚度方向区分上下表，检查场关闭阴影，避免把阴影条纹误认为 UV 或蒙皮纹理。当前材质不读取 UV，也不使用噪波。','主翼和水平尾翼依据表面朝向与翼厚中面区分上下表；发动机舱与机身使用各自高度分界；垂直尾翼保持上表色。检查场关闭阴影，当前材质不读取 UV，也不使用噪波。')
          h=h.replace('<b>上翼：</b>上视图左侧外翼，按参考图重新定位','<b>上翼：</b>上视图左侧外翼，星尖朝机头')
          h=h.replace('<b>下翼：</b>下视图机头朝下，画面右侧中外翼，星形方向已翻正','<b>下翼：</b>下视图机头朝下，画面右侧外翼，星尖朝机头')
          Path('b24-generic-skin-closed-doors-r6.html').write_text(h)
      - name: Syntax and scope checks
        run: |
          node --check runtime/b24-generic-skin-closed-doors-r6.js
          grep -q '__B24_GENERIC_R6__' runtime/b24-generic-skin-closed-doors-r6.js
          grep -q 'b24-generic-skin-closed-doors-r6.js' b24-generic-skin-closed-doors-r6.html
          ! grep -q '80 DAYS' b24-generic-skin-closed-doors-r6.html
      - name: Commit generated R6
        run: |
          git add b24-generic-skin-closed-doors-r6.html runtime/b24-generic-skin-closed-doors-r6.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(b24-skin): align common insignia and clean upper-lower paint R6'
          git push origin HEAD:feature/b24-generic-skin-closed-doors-v1
