name: B24 generic closed-door skin browser QA
on:
  push:
    branches: [feature/b24-generic-skin-closed-doors-v1]
    paths:
      - b24-generic-skin-closed-doors-r6.html
      - runtime/b24-generic-skin-closed-doors-r6.js
      - .github/workflows/b24-generic-closed-doors-browser-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install playwright==1.55.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Serve fixed branch content
        run: python -m http.server 8765 >/tmp/b24-r6-http.log 2>&1 &
      - name: Verify closed doors, paint split and reference-locked insignia
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, math
          from PIL import Image
          from playwright.sync_api import sync_playwright

          result={"page":"b24-generic-skin-closed-doors-r6.html","checks":[],"errors":[]}
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page(viewport={"width":1440,"height":900})
              page.on('console',lambda m: result["errors"].append(f"console {m.type}: {m.text}") if m.type=='error' else None)
              page.on('pageerror',lambda e: result["errors"].append('pageerror: '+str(e)))
              page.goto('http://127.0.0.1:8765/b24-generic-skin-closed-doors-r6.html',wait_until='domcontentloaded',timeout=30000)
              page.wait_for_function("() => getComputedStyle(document.querySelector('#loading')).display === 'none'",timeout=60000)
              page.wait_for_function("() => window.__B24_GENERIC_R6__?.results?.length === 4",timeout=60000)
              state=page.evaluate("""() => ({
                status:document.querySelector('#status').textContent,
                door:document.querySelector('#doorState').textContent,
                decal:document.querySelector('#decalState').textContent,
                loading:getComputedStyle(document.querySelector('#loading')).display,
                canvas:[document.querySelector('#scene').width,document.querySelector('#scene').height],
                split:document.querySelector('#split').value,
                audit:window.__B24_GENERIC_R6__
              })""")
              audit=state['audit'];names=[r['name'] for r in audit['results']];by={r['name']:r for r in audit['results']}
              top,bottom,port,starboard=(by['upper-port-wing'],by['lower-starboard-wing'],by['port-fuselage'],by['starboard-fuselage'])
              result['state']=state
              result['checks'] += [
                ["loading hidden",state['loading']=='none'],
                ["closed door source nodes",audit['closedDoorNodes']==[764,767,773,776]],
                ["closed door text",'关闭端点' in state['door']],
                ["full V018 inventory",'1784 节点 / 348 网格' in state['status']],
                ["paint restricted to airframe skin",audit['paintMeshCount']==228],
                ["exactly four named insignia",names==['upper-port-wing','lower-starboard-wing','port-fuselage','starboard-fuselage']],
                ["all insignia have surface triangles",all(r['triangles']>200 for r in audit['results'])],
                ["upper insignia outer port wing",top['min'][0]>11.0 and top['max'][0]<13.9],
                ["upper insignia inside chord",top['min'][2]>-0.9 and top['max'][2]<0.6],
                ["lower insignia outer starboard wing",bottom['max'][0]<-11.0 and bottom['min'][0]>-13.9],
                ["lower insignia inside chord",bottom['min'][2]>-0.9 and bottom['max'][2]<0.6],
                ["both wing stars point toward nose",audit['placement']['upperWing']['noseDirection']==[0,0,1] and audit['placement']['lowerWing']['noseDirection']==[0,0,1]],
                ["port fuselage never crosses centerline",port['min'][0]>.72],
                ["starboard fuselage never crosses centerline",starboard['max'][0]<-.72],
                ["fuselage insignia before waist doors",port['min'][2]>-5.5 and port['max'][2]<-3.0 and starboard['min'][2]>-5.5 and starboard['max'][2]<-3.0],
                ["fuselage insignia lowered",abs(audit['placement']['fuselage']['centerY']+.40)<1e-9],
                ["door surfaces excluded from insignia targets",audit['placement']['fuselage']['doorTargetsExcluded'] is True],
                ["olive drab demarcation lowered",abs(float(state['split'])+.96)<1e-9],
                ["reference work colors locked",audit['colors']=={'upper':'#5e5839','lower':'#8b8c97'}],
                ["paint classifier recorded",audit['paintClassifier']=='world-facing upper/lower with nacelle and vertical-fin guards'],
                ["inspection shadows disabled",audit['shadows'] is False],
                ["no page errors",not result['errors']]
              ]
              page.screenshot(path='b24-generic-r6-orbit.png',full_page=True)
              for view in ['top','bottom','port','starboard','front']:
                  page.locator(f'button[data-view="{view}"]').click();page.wait_for_timeout(950)
                  result['checks'].append([f'{view} view selected',page.evaluate("() => window.__B24_VIEW__")==view])
                  page.screenshot(path=f'b24-generic-r6-{view}.png',full_page=True)
              page.locator('#doorFocus').click();page.wait_for_timeout(950)
              page.screenshot(path='b24-generic-r6-door.png',full_page=True)
              browser.close()

          # Regression sample: the inner upper wing had been wrongly Neutral Gray in R5.
          top_image=Image.open('b24-generic-r6-top.png').convert('RGB')
          bottom_image=Image.open('b24-generic-r6-bottom.png').convert('RGB')
          def mean_patch(im,x,y,r=4):
              px=[]
              for yy in range(y-r,y+r+1):
                  for xx in range(x-r,x+r+1): px.append(im.getpixel((xx,yy)))
              return tuple(sum(c[i] for c in px)/len(px) for i in range(3))
          top_inner=mean_patch(top_image,360,420)
          top_outer=mean_patch(top_image,235,392)
          bottom_inner=mean_patch(bottom_image,360,500)
          result['pixelSamples']={'topInner':top_inner,'topOuter':top_outer,'bottomInner':bottom_inner}
          result['checks'] += [
              ["top inner wing matches upper-family chroma",abs(top_inner[0]-top_outer[0])<55 and abs(top_inner[2]-top_outer[2])<55],
              ["top and bottom wing remain visibly separated",sum(abs(top_inner[i]-bottom_inner[i]) for i in range(3))>35]
          ]
          result['passed']=all(v for _,v in result['checks'])
          Path('b24-generic-r6-browser-qa.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          print(json.dumps(result,ensure_ascii=False,indent=2))
          assert result['passed'],result
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b24-generic-closed-doors-r6-browser-qa
          path: |
            b24-generic-r6-browser-qa.json
            b24-generic-r6-*.png
          retention-days: 30
