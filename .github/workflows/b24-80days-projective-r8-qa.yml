name: B24 80 DAYS projective R8 QA
on:
  push:
    branches: [feature/b24-80days-projective-r8]
    paths:
      - b24-80days-projective-r8.html
      - runtime/b24-80days-projective-r8.js
      - .github/workflows/b24-80days-projective-r8-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static check
        run: node --check runtime/b24-80days-projective-r8.js
      - name: Install Chromium
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Serve
        run: python -m http.server 8765 >/tmp/r8-http.log 2>&1 &
      - name: Browser QA
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from playwright.sync_api import sync_playwright
          out=Path('reports/80-days-r8-qa');out.mkdir(parents=True,exist_ok=True)
          errors=[]
          with sync_playwright() as p:
              b=p.chromium.launch(headless=True)
              page=b.new_page(viewport={"width":1440,"height":900})
              page.on('console',lambda m: errors.append('console '+m.type+': '+m.text) if m.type=='error' else None)
              page.on('pageerror',lambda e: errors.append('pageerror: '+str(e)))
              page.goto('http://127.0.0.1:8765/b24-80days-projective-r8.html',wait_until='domcontentloaded',timeout=30000)
              page.wait_for_function("() => window.__B24_80DAYS_R8__ || window.__B24_80DAYS_R8_ERROR__",timeout=60000)
              state=page.evaluate("() => ({audit:window.__B24_80DAYS_R8__||null,error:window.__B24_80DAYS_R8_ERROR__||null,status:document.querySelector('#status')?.textContent})")
              page.wait_for_timeout(800);page.screenshot(path=str(out/'nose-port.png'))
              Path(out/'state.json').write_text(json.dumps({'state':state,'errors':errors},ensure_ascii=False,indent=2),encoding='utf-8')
              b.close()
          assert not state['error'],state
          a=state['audit']
          assert a['mother']['id']=='b24-generic-mother-01' and a['mother']['modified'] is False,a
          assert a['windowHypothesis']['component']==8,a
          assert a['windowHypothesis']['status']=='leading-shape-hypothesis-not-locked',a
          assert a['evidence']['shapeScore']>.75,a
          assert len(a['photoCardinals'])==4 and len(a['worldCardinals'])==4,a
          assert len(a['homography'])==9,a
          assert a['visualAcceptance'] is False and a['productionReady'] is False,a
          assert not errors,errors
          print(json.dumps({'status':state['status'],'photoCardinals':a['photoCardinals'],'worldCardinals':a['worldCardinals'],'homography':a['homography']},ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b24-80days-projective-r8-qa
          path: reports/80-days-r8-qa
          retention-days: 30
