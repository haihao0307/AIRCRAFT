name: B24 generic closed-door source export
on:
  workflow_dispatch:
  push:
    branches: [feature/b24-generic-skin-closed-doors-v1]
    paths:
      - .github/workflows/b24-generic-source-export.yml
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect current workbench and runtime
        run: |
          mkdir -p /tmp/b24-source
          cp b24-generic-skin-closed-doors-r1.html /tmp/b24-source/
          cp -r runtime /tmp/b24-source/
          cp docs/b24-generic-skin/CLOSED_DOOR_SOURCE_LOCK_V018_R2.json /tmp/b24-source/
      - uses: actions/upload-artifact@v4
        with:
          name: b24-generic-closed-door-source
          path: /tmp/b24-source
          retention-days: 7
