name: Bootstrap B24 data-native prototype V1

on:
  push:
    branches: [research/b24-engineering-drawings-cad-v1]

permissions:
  contents: write

jobs:
  materialize-prototype:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify and materialize the review payload
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/b24-native-prototype-v1/part-*.b64 | LC_ALL=C tr -cd 'A-Za-z0-9+/=' > /tmp/b24-native-prototype-v1.b64
          python3 - <<'PY'
          import base64
          from pathlib import Path
          source = Path('/tmp/b24-native-prototype-v1.b64').read_text(encoding='ascii')
          print(f'clean base64 chars: {len(source)}; remainder: {len(source) % 4}')
          source += '=' * ((4 - len(source) % 4) % 4)
          Path('/tmp/b24-native-prototype-v1.tar.gz').write_bytes(base64.b64decode(source, validate=False))
          PY
          echo "f5ce6232be9d566453f1e51dd61f9e5218b795c5edbe43e9de5255432c53ea14  /tmp/b24-native-prototype-v1.tar.gz" | sha256sum --check
          tar --extract --gzip --file /tmp/b24-native-prototype-v1.tar.gz --directory .
          rm -rf .bootstrap/b24-native-prototype-v1
          rm .github/workflows/bootstrap-b24-native-prototype-v1.yml
      - name: Validate executable native-aircraft contracts
        run: |
          node scripts/validate-b24-native-prototype-v1.mjs
          node scripts/build-static.mjs
      - name: Commit the materialized prototype
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "feat: add B24 data-native whole-aircraft prototype V1 [skip ci]"
          git push origin HEAD:research/b24-engineering-drawings-cad-v1
