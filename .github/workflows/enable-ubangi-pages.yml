name: Enable and deploy AIRCRAFT Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'turret-motion-v1.html'
      - 'src/**'
      - 'assets/**'
      - 'data/**'
      - 'docs/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/enable-ubangi-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: aircraft-pages-enable
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate website
        run: npm test
      - name: Build static website
        run: npm run build
      - name: Configure and enable Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
