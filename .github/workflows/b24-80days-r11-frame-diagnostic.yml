name: B24 80 DAYS R11 frame diagnostic
on:
  push:
    branches: [feature/b24-80days-scan-calibration-r10]
    paths:
      - .github/workflows/b24-80days-r11-frame-diagnostic.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Serve
        run: python -m http.server 8765 >/tmp/r11-frame-http.log 2>&1 &
      - name: Inspect and colour-map nose meshes
        run: |
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          import json
          out=Path('reports/80-days-r11-frame-diagnostic');out.mkdir(parents=True,exist_ok=True)
          errors=[]
          with sync_playwright() as p:
              b=p.chromium.launch(headless=True)
              page=b.new_page(viewport={'width':1440,'height':900},device_scale_factor=1)
              page.on('console',lambda m: errors.append('console '+m.type+': '+m.text) if m.type=='error' else None)
              page.on('pageerror',lambda e: errors.append('pageerror: '+str(e)))
              page.goto('http://127.0.0.1:8765/b24-80days-instance-r11.html',wait_until='domcontentloaded',timeout=30000)
              page.wait_for_function('() => window.__B24_AIRCRAFT__ || window.__B24_80DAYS_R11_ERROR__',timeout=90000)
              page.locator('#artToggle').uncheck()
              page.evaluate('''() => {
                const a=window.__B24_AIRCRAFT__;
                const colors={1687:0xff2020,1675:0x20ff20,1783:0x2060ff,1735:0xff20ff,93:0xffff20,86:0x20ffff};
                for(const m of a.meshes){
                  const id=m.userData.sourceNode;
                  if(colors[id]!==undefined){m.visible=true;m.material.color.setHex(colors[id]);m.material.metalness=0;m.material.roughness=.7;m.material.needsUpdate=true;}
                }
              }''')
              page.locator('button[data-view="port"]').click();page.wait_for_timeout(1000);page.screenshot(path=str(out/'candidate-port.png'))
              page.locator('button[data-view="nose-port"]').click();page.wait_for_timeout(1000);page.screenshot(path=str(out/'candidate-nose-port.png'))
              data=page.evaluate('''() => {
                const a=window.__B24_AIRCRAFT__;a.group.updateMatrixWorld(true);const rows=[];
                for(const mesh of a.meshes){
                  const id=mesh.userData.sourceNode,bb=mesh.geometry.boundingBox?.clone();if(!bb)continue;bb.applyMatrix4(mesh.matrixWorld);
                  const min=[bb.min.x,bb.min.y,bb.min.z],max=[bb.max.x,bb.max.y,bb.max.z];const center=min.map((v,i)=>(v+max[i])/2),size=min.map((v,i)=>max[i]-v);
                  const family=mesh.userData.family||'',path=a.paths[id]||'';
                  if(family==='glass'||center[2]>3.0&&center[2]<8.5&&Math.abs(center[0])<2.2&&center[1]>-2.2&&center[1]<2.2)
                    rows.push({id,path,family,visible:mesh.visible,transparent:!!mesh.material?.transparent,opacity:mesh.material?.opacity,center:center.map(v=>+v.toFixed(4)),size:size.map(v=>+v.toFixed(4))});
                }
                rows.sort((x,y)=>y.center[2]-x.center[2]);return {rows};
              }''')
              Path(out/'nose-and-glass-meshes.json').write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding='utf-8')
              Path(out/'errors.json').write_text(json.dumps(errors,ensure_ascii=False,indent=2),encoding='utf-8')
              b.close()
          assert not errors,errors
          print('ROWS',len(data['rows']))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b24-80days-r11-frame-diagnostic
          path: reports/80-days-r11-frame-diagnostic
          retention-days: 7
