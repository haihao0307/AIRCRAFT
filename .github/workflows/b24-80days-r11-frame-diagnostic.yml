name: B24 80 DAYS R11 frame diagnostic
on:
  push:
    branches: [feature/b24-80days-scan-calibration-r10]
    paths:
      - .github/workflows/b24-80days-r11-frame-diagnostic.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Serve
        run: python -m http.server 8765 >/tmp/r11-frame-http.log 2>&1 &
      - name: Inspect nose meshes
        run: |
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          import json
          out=Path('reports/80-days-r11-frame-diagnostic');out.mkdir(parents=True,exist_ok=True)
          errors=[]
          with sync_playwright() as p:
              b=p.chromium.launch(headless=True)
              page=b.new_page(viewport={'width':1440,'height':900},device_scale_factor=1)
              page.on('console',lambda m: errors.append('console '+m.type+': '+m.text) if m.type=='error' else None)
              page.on('pageerror',lambda e: errors.append('pageerror: '+str(e)))
              page.goto('http://127.0.0.1:8765/b24-80days-instance-r11.html',wait_until='domcontentloaded',timeout=30000)
              page.wait_for_function('() => window.__B24_AIRCRAFT__ || window.__B24_80DAYS_R11_ERROR__',timeout=90000)
              data=page.evaluate('''() => {
                const a=window.__B24_AIRCRAFT__;
                if(!a) return {error:window.__B24_80DAYS_R11_ERROR__};
                a.group.updateMatrixWorld(true);
                const rows=[];
                for(const mesh of a.meshes){
                  const id=mesh.userData.sourceNode;
                  const bb=mesh.geometry.boundingBox?.clone();
                  if(!bb) continue;
                  bb.applyMatrix4(mesh.matrixWorld);
                  const min=[bb.min.x,bb.min.y,bb.min.z],max=[bb.max.x,bb.max.y,bb.max.z];
                  const center=min.map((v,i)=>(v+max[i])/2),size=min.map((v,i)=>max[i]-v);
                  if(center[2]<4.0 || center[2]>11.5 || Math.abs(center[0])>3.0 || center[1]<-3.0 || center[1]>3.0) continue;
                  rows.push({id,path:a.paths[id]||'',family:mesh.userData.family||'',name:mesh.name||'',visible:mesh.visible,
                    material:mesh.material?.type||'',transparent:!!mesh.material?.transparent,opacity:mesh.material?.opacity,
                    center:center.map(v=>+v.toFixed(4)),size:size.map(v=>+v.toFixed(4)),min:min.map(v=>+v.toFixed(4)),max:max.map(v=>+v.toFixed(4))});
                }
                rows.sort((x,y)=>y.center[2]-x.center[2]||x.center[1]-y.center[1]);
                return {count:rows.length,rows};
              }''')
              Path(out/'nose-meshes.json').write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding='utf-8')
              Path(out/'errors.json').write_text(json.dumps(errors,ensure_ascii=False,indent=2),encoding='utf-8')
              page.screenshot(path=str(out/'nose.png'))
              b.close()
          assert not data.get('error'),data
          assert not errors,errors
          print('CANDIDATES',data['count'])
          for r in data['rows']:
              p=r['path'].lower();f=r['family'].lower()
              if any(k in p for k in ['glass','window','wind','nose','frame','cockpit','canopy']) or f in ['glass','exterior-skin','skin']:
                  print(json.dumps(r,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b24-80days-r11-frame-diagnostic
          path: reports/80-days-r11-frame-diagnostic
          retention-days: 7
