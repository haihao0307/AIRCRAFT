name: Materialize B24 native review V005

on:
  push:
    branches:
      - research/b24-engineering-drawings-cad-v1
    paths:
      - '.github/workflows/b24-native-review-v005.yml'
      - 'tools/b24-native-review-v005/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: b24-native-review-v005
  cancel-in-progress: false

jobs:
  materialize-and-verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MIRROR_ARTIFACT_ID: '9640740604'
      TARGET_DIR: preview/b24-native-review-v005
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore V005 builder bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v005-builder"
          base64 --decode tools/b24-native-review-v005/bundle.tar.gz.b64 > "$RUNNER_TEMP/v005-builder.tar.gz"
          tar -xzf "$RUNNER_TEMP/v005-builder.tar.gz" -C "$RUNNER_TEMP/v005-builder"
          test -s "$RUNNER_TEMP/v005-builder/build.py"
          test -s "$RUNNER_TEMP/v005-builder/app.js"
          test -s "$RUNNER_TEMP/v005-builder/index.html"

      - name: Download exact reference mirror artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/b24-mirror"
          curl --fail --location --retry 5 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${MIRROR_ARTIFACT_ID}/zip" \
            -o "$RUNNER_TEMP/b24-mirror.zip"
          unzip -q "$RUNNER_TEMP/b24-mirror.zip" -d "$RUNNER_TEMP/b24-mirror"
          test -s "$RUNNER_TEMP/b24-mirror/reference-accessor-payload.bin"
          test -s "$RUNNER_TEMP/b24-mirror/scene-graph.json"
          test -s "$RUNNER_TEMP/b24-mirror/accessors.json"

      - name: Build V005 native review
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$TARGET_DIR"
          python3 "$RUNNER_TEMP/v005-builder/build.py" \
            --mirror "$RUNNER_TEMP/b24-mirror" \
            --output "$TARGET_DIR"
          cp "$RUNNER_TEMP/v005-builder/app.js" "$TARGET_DIR/app.js"
          cp "$RUNNER_TEMP/v005-builder/index.html" "$TARGET_DIR/index.html"
          node --check "$TARGET_DIR/app.js"

      - name: Verify numeric payload and clean-skin contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip
          import hashlib
          import json
          from pathlib import Path

          root = Path('preview/b24-native-review-v005')
          manifest = json.loads(gzip.decompress((root / 'data/native-manifest.json.gz').read_bytes()))
          chunks = manifest['payload']['chunks']
          payload = b''.join((root / 'data' / entry['file']).read_bytes() for entry in chunks)
          assert len(payload) == manifest['payload']['bytes'] == 12509172
          assert hashlib.sha256(payload).hexdigest() == manifest['payload']['sha256']
          assert manifest['sourceLock']['sha256'] == '541c3dcfb98ab590cdb1bc90d6ddcdfe80bce2a4b937f3bccefab0c7efe8be0d'
          assert manifest['statistics']['nodes'] == 1784
          assert manifest['statistics']['meshes'] == 348
          assert manifest['statistics']['triangles'] == 325358
          assert manifest['statistics']['animationChannels'] == 2518
          assert manifest['surfaceSystem']['airframeUsesUv'] is False
          assert manifest['surfaceSystem']['airframeUsesRasterTextures'] is False
          assert len(manifest['surfaceSystem']['cleanSkinHiddenNodes']) >= 10
          assert len(manifest['controllers']['sideDoors']) == 2
          assert set(manifest['controllers']['propellerModes']) == {'static', 'blur', 'inspection'}
          print('B24 V005 numeric and clean-skin contracts: PASS')
          PY

      - name: Commit generated online review
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TARGET_DIR"
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "build: publish B24 native review V005 [skip ci]"
            git push origin HEAD:research/b24-engineering-drawings-cad-v1
          fi
          SHA="$(git rev-parse HEAD)"
          URL="https://cdn.githubraw.com/haihao0307/AIRCRAFT/${SHA}/${TARGET_DIR}/index.html"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Real browser smoke
        shell: bash
        env:
          ONLINE_URL: ${{ steps.commit.outputs.url }}
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          READY=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --location "$ONLINE_URL" -o /tmp/v005.html; then
              if grep -q 'B24 数据原生整机检查 V005' /tmp/v005.html; then
                READY=1
                break
              fi
            fi
            sleep 5
          done
          test "$READY" = "1"
          FLAGS=(
            --headless=new
            --no-sandbox
            --disable-dev-shm-usage
            --enable-webgl
            --ignore-gpu-blocklist
            --use-gl=angle
            --use-angle=swiftshader-webgl
            --enable-unsafe-swiftshader
            --window-size=1600,1000
            --virtual-time-budget=60000
          )
          timeout 150s "$CHROME" "${FLAGS[@]}" --dump-dom "$ONLINE_URL" > /tmp/v005-dom.html
          grep -q 'data-qa="pass"' /tmp/v005-dom.html
          timeout 150s "$CHROME" "${FLAGS[@]}" --screenshot="$GITHUB_WORKSPACE/b24-native-review-v005.png" "$ONLINE_URL"
          test -s "$GITHUB_WORKSPACE/b24-native-review-v005.png"
          {
            echo '## B24 native review V005 verified'
            echo
            echo "Online URL: $ONLINE_URL"
            echo
            echo 'ANFD hash, no-UV skin, daylight view, propeller modes, side doors, and browser render: PASS'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: b24-native-review-v005-${{ steps.commit.outputs.sha }}
          path: b24-native-review-v005.png
          if-no-files-found: error
          retention-days: 30
