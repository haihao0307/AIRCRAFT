name: Publish B24 strict reference preview

on:
  push:
    branches:
      - research/b24-engineering-drawings-cad-v1
    paths:
      - 'preview/b24-reference-exact/**'
      - 'data/b24-native/**'
      - 'scripts/distill-b24-reference-glb.mjs'
      - 'scripts/extract-b24-reference-full-mirror.mjs'
      - 'scripts/validate-b24-reference-full-mirror.mjs'
      - '.github/workflows/b24-reference-preview-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aircraft-reference-preview
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate native contracts
        run: node scripts/validate-b24-native-contracts.mjs

      - name: Download and verify locked reference model
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 \
            --output "$RUNNER_TEMP/b-24_liberator.glb" \
            https://github.com/haihao0307/AIRCRAFT/releases/download/80-days-source-v1/b-24_liberator.glb
          test "$(stat --format=%s "$RUNNER_TEMP/b-24_liberator.glb")" = "23085972"
          echo "541c3dcfb98ab590cdb1bc90d6ddcdfe80bce2a4b937f3bccefab0c7efe8be0d  $RUNNER_TEMP/b-24_liberator.glb" | sha256sum --check

      - name: Build exact reference preview and evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/b24-reference-exact/assets
          cp preview/b24-reference-exact/index.html _site/b24-reference-exact/
          cp preview/b24-reference-exact/styles.css _site/b24-reference-exact/
          cp preview/b24-reference-exact/viewer.js _site/b24-reference-exact/
          cp "$RUNNER_TEMP/b-24_liberator.glb" _site/b24-reference-exact/assets/

          node scripts/distill-b24-reference-glb.mjs \
            --glb "$RUNNER_TEMP/b-24_liberator.glb" \
            --out-dir _site/b24-reference-exact/reports/distillation

          node scripts/extract-b24-reference-full-mirror.mjs \
            --glb "$RUNNER_TEMP/b-24_liberator.glb" \
            --out-dir _site/b24-reference-exact/reports/full-mirror

          node scripts/validate-b24-reference-full-mirror.mjs \
            --mirror-dir _site/b24-reference-exact/reports/full-mirror

          rm -f _site/b24-reference-exact/reports/full-mirror/reference-accessor-payload.bin
          rm -f _site/b24-reference-exact/reports/full-mirror/accessors.json
          rm -f _site/b24-reference-exact/reports/full-mirror/source-assets.json
          rm -rf _site/b24-reference-exact/reports/full-mirror/images

          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          info = {
              "branch": os.environ["GITHUB_REF_NAME"],
              "commit": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "built_at": datetime.now(timezone.utc).isoformat(),
              "source_model": {
                  "file": "b-24_liberator.glb",
                  "bytes": 23085972,
                  "sha256": "541c3dcfb98ab590cdb1bc90d6ddcdfe80bce2a4b937f3bccefab0c7efe8be0d"
              },
              "approval": {
                  "visual_parity_approved": False,
                  "animation_semantics_approved": False,
                  "native_geometry_replacement_approved": False
              }
          }
          with open("_site/b24-reference-exact/build-info.json", "w", encoding="utf-8") as handle:
              json.dump(info, handle, ensure_ascii=False, indent=2)
              handle.write("\n")
          PY

      - name: Local browser smoke test
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          python3 -m http.server 4173 --directory _site >/tmp/b24-preview-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          COMMON_FLAGS=(
            --headless=new
            --no-sandbox
            --disable-dev-shm-usage
            --disable-gpu-sandbox
            --enable-webgl
            --ignore-gpu-blocklist
            --use-gl=angle
            --use-angle=swiftshader-webgl
            --enable-unsafe-swiftshader
            --window-size=1600,1000
            --virtual-time-budget=55000
          )
          timeout 120s "$CHROME" "${COMMON_FLAGS[@]}" \
            --dump-dom \
            http://127.0.0.1:4173/b24-reference-exact/ > /tmp/b24-local-dom.html
          grep -q 'data-qa="pass"' /tmp/b24-local-dom.html
          timeout 120s "$CHROME" "${COMMON_FLAGS[@]}" \
            --screenshot="$GITHUB_WORKSPACE/_site/b24-reference-exact/reports/local-browser-smoke.png" \
            http://127.0.0.1:4173/b24-reference-exact/
          test -s _site/b24-reference-exact/reports/local-browser-smoke.png

      - name: Materialize immutable online viewer
        id: materialize
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path('preview/b24-reference-exact')
          model_url = 'https://github.com/haihao0307/AIRCRAFT/releases/download/80-days-source-v1/b-24_liberator.glb'
          viewer = (root / 'viewer.js').read_text(encoding='utf-8')
          marker = "fetch('./assets/b-24_liberator.glb'"
          if marker not in viewer:
              raise SystemExit('Expected local model marker was not found')
          viewer = viewer.replace(marker, f"fetch('{model_url}'", 1)
          (root / 'viewer-online.js').write_text(viewer, encoding='utf-8')

          html = (root / 'index.html').read_text(encoding='utf-8')
          html = html.replace('src="./viewer.js"', 'src="./viewer-online.js"')
          replacements = {
              './reports/full-mirror/manifest.json': 'https://github.com/haihao0307/AIRCRAFT/blob/research/b24-engineering-drawings-cad-v1/docs/aircraft-pipeline/B24_REFERENCE_FULL_MIRROR.md',
              './reports/full-mirror/qa.json': 'https://github.com/haihao0307/AIRCRAFT/blob/research/b24-engineering-drawings-cad-v1/data/b24-native/reference-mirror-contract.json',
              './reports/full-mirror/animations.json': 'https://github.com/haihao0307/AIRCRAFT/blob/research/b24-engineering-drawings-cad-v1/data/b24-native/animation-review-queue.json',
              './reports/full-mirror/semantic-candidates.json': 'https://github.com/haihao0307/AIRCRAFT/pull/14',
              './reports/distillation/reference-glb-distillation.json': 'https://github.com/haihao0307/AIRCRAFT/blob/research/b24-engineering-drawings-cad-v1/reports/b24-native/reference-glb-distillation-baseline.json',
              './build-info.json': 'https://raw.githubusercontent.com/haihao0307/AIRCRAFT/research/b24-engineering-drawings-cad-v1/preview/b24-reference-exact/build-info.json'
          }
          for old, new in replacements.items():
              html = html.replace(old, new)
          (root / 'online.html').write_text(html, encoding='utf-8')

          info = {
              'branch': os.environ['GITHUB_REF_NAME'],
              'commit': os.environ['GITHUB_SHA'],
              'built_at': datetime.now(timezone.utc).isoformat(),
              'source_model': {
                  'url': model_url,
                  'bytes': 23085972,
                  'sha256': '541c3dcfb98ab590cdb1bc90d6ddcdfe80bce2a4b937f3bccefab0c7efe8be0d'
              },
              'approval': {
                  'visual_parity_approved': False,
                  'animation_semantics_approved': False,
                  'native_geometry_replacement_approved': False
              }
          }
          (root / 'build-info.json').write_text(json.dumps(info, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/b24-reference-exact/online.html \
                  preview/b24-reference-exact/viewer-online.js \
                  preview/b24-reference-exact/build-info.json
          if ! git diff --cached --quiet; then
            git commit -m "build: materialize immutable B24 online review viewer [skip ci]"
            git push origin HEAD:research/b24-engineering-drawings-cad-v1
          fi
          ONLINE_SHA="$(git rev-parse HEAD)"
          ONLINE_URL="https://cdn.jsdelivr.net/gh/haihao0307/AIRCRAFT@${ONLINE_SHA}/preview/b24-reference-exact/online.html"
          echo "sha=$ONLINE_SHA" >> "$GITHUB_OUTPUT"
          echo "url=$ONLINE_URL" >> "$GITHUB_OUTPUT"

      - name: Verify public immutable CDN page
        shell: bash
        env:
          ONLINE_URL: ${{ steps.materialize.outputs.url }}
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          COMMON_FLAGS=(
            --headless=new
            --no-sandbox
            --disable-dev-shm-usage
            --disable-gpu-sandbox
            --enable-webgl
            --ignore-gpu-blocklist
            --use-gl=angle
            --use-angle=swiftshader-webgl
            --enable-unsafe-swiftshader
            --window-size=1600,1000
            --virtual-time-budget=65000
          )
          READY=0
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --location "$ONLINE_URL" -o /tmp/b24-online.html; then
              if grep -q 'B24 权威参考模型精确镜像审核' /tmp/b24-online.html; then
                READY=1
                break
              fi
            fi
            sleep 5
          done
          test "$READY" = "1"
          timeout 150s "$CHROME" "${COMMON_FLAGS[@]}" \
            --dump-dom \
            "$ONLINE_URL" > /tmp/b24-online-dom.html
          if ! grep -q 'data-qa="pass"' /tmp/b24-online-dom.html; then
            tail -300 /tmp/b24-online-dom.html
            exit 1
          fi
          timeout 150s "$CHROME" "${COMMON_FLAGS[@]}" \
            --screenshot="$GITHUB_WORKSPACE/_site/b24-reference-exact/reports/online-browser-smoke.png" \
            "$ONLINE_URL"
          test -s _site/b24-reference-exact/reports/online-browser-smoke.png
          {
            echo '## B24 strict reference preview'
            echo
            echo "Public immutable URL: $ONLINE_URL"
            echo
            echo "Source SHA256: 541c3dcfb98ab590cdb1bc90d6ddcdfe80bce2a4b937f3bccefab0c7efe8be0d"
            echo
            echo 'Browser source lock, exact inventory and WebGL rendering: PASS'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload review evidence
        uses: actions/upload-artifact@v4
        with:
          name: b24-reference-preview-${{ steps.materialize.outputs.sha }}
          path: _site/b24-reference-exact/reports
          if-no-files-found: error
          retention-days: 30
