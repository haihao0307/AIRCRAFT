name: B24 clean source and browser verification
on:
  push:
    branches: [feature/b24-v017-clean-restart-workbench]
    paths:
      - 'runtime/**'
      - 'tools/build.py'
      - 'tools/browser_qa.py'
      - 'tools/effect-state.test.js'
      - 'UPSTREAM_LOCK.json'
      - 'package.json'
      - '.github/workflows/b24-clean-verify.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: b24-clean-source-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: State logic tests
        run: node --test tools/effect-state.test.js
      - name: Assemble only locked runtime
        run: python tools/build.py
      - name: Browser prerequisites
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Desktop and mobile browser checks
        run: python tools/browser_qa.py
      - name: Save checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B24-clean-checks
          path: reports/
      - name: Save complete clean source and dependencies
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: B24-clean-full-source
          include-hidden-files: true
          path: |
            runtime/
            tools/
            knowledge/
            *.md
            *.json
            .github/workflows/b24-clean-verify.yml
      - name: Commit verified standalone runtime
        if: success()
        run: |
          git config user.name 'B24 verification'
          git config user.email 'b24-verification@users.noreply.github.com'
          git add runtime/assets runtime/vendor runtime/index.html reports
          git diff --cached --quiet || git commit -m 'build(b24): retain verified standalone runtime and browser evidence'
          git push origin HEAD:feature/b24-v017-clean-restart-workbench
