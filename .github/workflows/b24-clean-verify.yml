name: B24 clean source and browser verification
on:
  push:
    branches: [feature/b24-v017-clean-restart-workbench]
    paths:
      - 'runtime/**'
      - 'tools/**'
      - 'STARTUP_PATCH.json'
      - 'UPSTREAM_LOCK.json'
      - 'package.json'
      - '.github/workflows/b24-clean-verify.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: b24-clean-source-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Loader and retained effects logic tests
        run: node --test tools/asset-loader.test.js tools/effect-state.test.js
      - name: Assemble hash-locked startup patch
        run: python tools/build.py
      - name: Browser prerequisites
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Slow connections and failure recovery
        run: python tools/startup_browser_qa.py
      - name: Retained desktop and mobile behavior
        run: python tools/browser_qa.py
      - name: Save checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B24-startup-checks
          path: reports/
      - name: Save tested runtime
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: B24-startup-runtime
          path: runtime/
      - name: Commit verified standalone runtime
        if: success()
        run: |
          git config user.name 'B24 verification'
          git config user.email 'b24-verification@users.noreply.github.com'
          git add runtime reports
          git diff --cached --quiet || git commit -m 'build(b24): materialize tested bounded startup and recovery evidence'
          git push origin HEAD:feature/b24-v017-clean-restart-workbench
