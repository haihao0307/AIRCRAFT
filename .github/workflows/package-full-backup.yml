name: Package immutable B24 full backup
on:
  push:
    branches: [backup/b24-full-snapshot-20260907-r1]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: b24-full-backup-20260907-r1
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build deterministic complete ZIP
        run: python tools/build_backup_zip.py
      - name: Verify ZIP members and checksum
        run: |
          python - <<'PY'
          import hashlib, pathlib, zipfile
          p=pathlib.Path('B24_FULL_BACKUP_2026-09-07_R1.zip')
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              names=set(z.namelist())
          for required in ['01_ACCEPTED_V017/AGENTS.md','02_V018_NATIVE_CURRENT/CURRENT.json','03_SKIN_SINGLEFILE_V018_R2/deliveries/b24-skin-static-v018-r2-singlefile/B24_SKIN_STATIC_V018_R2_SIDE_DOORS_CLOSED.html','04_LIVERY_80_DAYS_RESEARCH/AGENTS.md','05_LIVERY_UBANGI_RESEARCH/AGENTS.md','BACKUP_MANIFEST.json','RESTART_PLAN.md']:
              assert required in names, required
          digest=hashlib.sha256(p.read_bytes()).hexdigest()
          assert pathlib.Path('SHA256SUMS.txt').read_text().split()[0] == digest
          print(len(names), p.stat().st_size, digest)
          PY
      - name: Preserve workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: B24_FULL_BACKUP_2026-09-07_R1
          path: |
            B24_FULL_BACKUP_2026-09-07_R1.zip
            SHA256SUMS.txt
          compression-level: 0
      - name: Create or refresh permanent GitHub release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=b24-full-backup-20260907-r1
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" B24_FULL_BACKUP_2026-09-07_R1.zip SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" B24_FULL_BACKUP_2026-09-07_R1.zip SHA256SUMS.txt --title "B24 Full Backup 2026-09-07 R1" --notes-file RELEASE_NOTES.md --target "${GITHUB_SHA}"
          fi
