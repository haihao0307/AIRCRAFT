name: WM native rule and Blender probe
on:
  push:
    branches: [feature/b24-weapons-mother-v1]
    paths:
      - native/weapons-visual/**
      - .github/workflows/wm-native-rule-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            native/weapons-visual
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rule and asset-guard tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python -m unittest discover -s native/weapons-visual/tests -p 'test_*.py' -v 2>&1 | tee reports/unit-tests.txt
          python native/weapons-visual/tools/check_release.py native/weapons-visual > reports/package-guard-before.json
          git rev-parse HEAD > reports/SOURCE_COMMIT.txt
      - name: Install pinned official Blender Python module
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir bpy==4.5.0 --extra-index-url https://download.blender.org/pypi/
          python -m pip freeze > reports/environment.txt
      - name: Real Blender geometry and shader-graph probe
        run: |
          python native/weapons-visual/tools/blender_probe.py reports/blender-probe.json
          python native/weapons-visual/tools/check_release.py native/weapons-visual > reports/package-guard-after.json
      - name: Upload text reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WM_NATIVE_RULE_PROBE_${{ github.sha }}
          path: reports/
          retention-days: 30
          if-no-files-found: error
