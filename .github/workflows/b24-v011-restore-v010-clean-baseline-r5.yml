name: Restore B24 V010 clean aircraft baseline R5

on:
  push:
    branches:
      - fix/b24-v011-restore-v010-clean-baseline
    paths:
      - '.github/workflows/b24-v011-restore-v010-clean-baseline-r5.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore-clean-v010:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      V010_ROOT: handoff/2026-08-29-b24-v010-ridged-noise-v002/current_v010
      RECOVERY_ROOT: handoff/2026-08-29-b24-v011-restore-v010-clean-baseline
      EVIDENCE_ROOT: recovery-evidence-r5
      DIST_ROOT: dist/AIRCRAFT_B24_V011_RECOVERED_TO_V010_CLEAN_BASELINE_R5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify exact frozen V010 inputs
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/v010-r5.sha256" <<'EOF'
          1b5b860ca78a7d55ea25d0d972a1d323125a57982d09452e7f7e0cb55d64a949  handoff/2026-08-29-b24-v010-ridged-noise-v002/current_v010/B24_V010_RIDGED_LOCAL_DAMAGE_REVIEW.html
          980081d1e4a36edf60f705a1ab71adb250681f1e4d3e9bde95657edb3a437f1c  handoff/2026-08-29-b24-v010-ridged-noise-v002/current_v010/B24_V010_RIDGED_LOCAL_DAMAGE_DELIVERY_2026-08-29.zip
          bc23f4fb04e58552e04872f3c2125eb3ec6d5902d94fbeddd07f06bd88a0149c  handoff/2026-08-29-b24-v010-ridged-noise-v002/current_v010/B24_V010_CLEAN_FULL_SERVICE.png
          a103e7b066e5d61d639e3c06c7e6b6bae0428c458656f5133c11a139dd276344  handoff/2026-08-29-b24-v010-ridged-noise-v002/current_v010/B24_V010_RIDGED_PATCH.js
          EOF
          sha256sum --check "$RUNNER_TEMP/v010-r5.sha256"

      - name: Install pinned real-browser QA dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow==11.3.0 playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Prepare calibrated recovery-only QA runner
        shell: bash
        run: |
          set -euo pipefail
          cp tools/qa_b24_v011_restore_v010_exact.py "$RUNNER_TEMP/qa_b24_v011_restore_v010_r5.py"
          python - <<'PY'
          from pathlib import Path
          path = Path('/home/runner/work/_temp/qa_b24_v011_restore_v010_r5.py')
          text = path.read_text(encoding='utf-8')
          old = 'off_service["changedRatio"] > 0.002 and off_service["meanAbsoluteChannelDelta"] > 0.02'
          new = 'off_service["changedRatio"] > 0.002 and off_service["meanAbsoluteChannelDelta"] > 0.01'
          if text.count(old) != 1:
              raise RuntimeError(f'Expected one service threshold expression, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Start exact frozen V010 page
        shell: bash
        run: |
          set -euo pipefail
          cd "$V010_ROOT"
          python -m http.server 8766 --bind 127.0.0.1 > "$GITHUB_WORKSPACE/b24-v010-r5-http.log" 2>&1 &
          echo $! > "$GITHUB_WORKSPACE/b24-v010-r5-http.pid"
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8766/B24_V010_RIDGED_LOCAL_DAMAGE_REVIEW.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$GITHUB_WORKSPACE/b24-v010-r5-http.log"
          exit 1

      - name: Run exact-aircraft Chromium QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_ROOT"
          xvfb-run -a python "$RUNNER_TEMP/qa_b24_v011_restore_v010_r5.py" \
            --root "$V010_ROOT" \
            --output "$EVIDENCE_ROOT" \
            --url http://127.0.0.1:8766/B24_V010_RIDGED_LOCAL_DAMAGE_REVIEW.html \
            | tee b24-v010-r5-browser.log

      - name: Verify complete recovery gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = Path(os.environ['EVIDENCE_ROOT'])
          report = json.loads((evidence / 'B24_V011_RESTORE_V010_EXACT_QA.json').read_text(encoding='utf-8'))
          assert report['status'] == 'PASS_RECOVERY_PREVIEW_ONLY', report['status']
          assert report['source']['bytes'] == 12550988
          assert report['source']['sha256'] == '1b5b860ca78a7d55ea25d0d972a1d323125a57982d09452e7f7e0cb55d64a949'
          assert report['runtime']['sourcePayloadChanged'] is False
          assert report['runtime']['geometryChanged'] is False
          assert report['runtime']['animationChanged'] is False
          assert all(value is False for value in report['runtime']['approvals'].values())
          assert report['runtime']['coverage']['counts']['protected'] == 121
          assert report['runtime']['coverage']['triangles']['protected'] == 92293
          assert report['surfaceLayer']['offToService']['changedRatio'] > 0.005
          assert report['surfaceLayer']['offToService']['meanAbsoluteChannelDelta'] > 0.01
          assert report['surfaceLayer']['serviceToDiagnostic']['changedRatio'] > 0.04
          assert report['propeller']['wrappedAngleDelta'] > 0.1
          assert report['propeller']['after']['rpm'] > 0.02
          assert report['propeller']['after']['updateCount'] > report['propeller']['before']['updateCount']
          assert report['browser']['pageErrors'] == []
          assert report['browser']['seriousConsoleErrors'] == []
          assert report['totals']['failed'] == 0

          scope = {
              'schema': 'haihao.aircraft/b24-v011-recovery-scope@1.0.0',
              'status': 'PASS_RECOVERY_PREVIEW_ONLY',
              'repository': 'haihao0307/AIRCRAFT',
              'branch': os.environ.get('GITHUB_REF_NAME'),
              'commit': os.environ.get('GITHUB_SHA'),
              'restoredIntegrationCommit': '6587e02d9b91d2e5ed82ceb6c84ca14573488ff8',
              'exactHtmlSha256': report['source']['sha256'],
              'aircraftPrimary': True,
              'noiseToolLocalOverlay': True,
              'rejectedLocalV011R1Excluded': True,
              'visualBaselineRestored': True,
              'sourcePayloadChanged': False,
              'geometryChanged': False,
              'animationChanged': False,
              'propellerMotionQaPassed': True,
              'pageErrors': [],
              'seriousConsoleErrors': [],
              'productionApproved': False,
              'approvalBoundary': report['approvalBoundary'],
              'checks': report['totals'],
          }
          (evidence / 'B24_V011_RECOVERY_SCOPE.json').write_text(
              json.dumps(scope, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(scope, ensure_ascii=False, indent=2))
          PY
          echo '1b5b860ca78a7d55ea25d0d972a1d323125a57982d09452e7f7e0cb55d64a949  handoff/2026-08-29-b24-v010-ridged-noise-v002/current_v010/B24_V010_RIDGED_LOCAL_DAMAGE_REVIEW.html' | sha256sum --check

      - name: Stop exact V010 page
        if: always()
        shell: bash
        run: |
          if [ -f b24-v010-r5-http.pid ]; then
            kill "$(cat b24-v010-r5-http.pid)" 2>/dev/null || true
          fi

      - name: Assemble recovered V010 delivery
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$DIST_ROOT"
          mkdir -p "$DIST_ROOT/v010_exact" "$DIST_ROOT/evidence/fresh" "$DIST_ROOT/evidence/frozen" "$DIST_ROOT/recovery" "$DIST_ROOT/records"

          cp "$V010_ROOT/B24_V010_RIDGED_LOCAL_DAMAGE_REVIEW.html" "$DIST_ROOT/v010_exact/B24_V010_RESTORED_CLEAN_BASELINE.html"
          cp "$V010_ROOT/B24_V010_RIDGED_LOCAL_DAMAGE_DELIVERY_2026-08-29.zip" "$DIST_ROOT/v010_exact/"
          cp "$V010_ROOT/B24_V010_RIDGED_PATCH.js" "$DIST_ROOT/v010_exact/"
          cp "$V010_ROOT/B24_V010_IMPLEMENTATION_NOTES.md" "$DIST_ROOT/v010_exact/"
          cp "$V010_ROOT/B24_V010_CLEAN_FULL_SERVICE.png" "$DIST_ROOT/evidence/frozen/"
          cp "$V010_ROOT/B24_V010_BROWSER_QA.json" "$DIST_ROOT/evidence/frozen/"
          cp handoff/2026-08-29-b24-v010-ridged-noise-v002/records/MANIFEST.json "$DIST_ROOT/records/V010_SOURCE_MANIFEST.json"
          cp "$RECOVERY_ROOT/00_README_FIRST.md" "$DIST_ROOT/recovery/"
          cp "$RECOVERY_ROOT/B24_V011_RECOVERY_CONTRACT.json" "$DIST_ROOT/recovery/"
          cp "$EVIDENCE_ROOT"/* "$DIST_ROOT/evidence/fresh/"
          cp b24-v010-r5-browser.log "$DIST_ROOT/records/"
          cp b24-v010-r5-http.log "$DIST_ROOT/records/"

          cat > "$DIST_ROOT/README_FIRST.md" <<'EOF'
          # B24 已恢复到 V010 正确整机主线

          打开 `v010_exact/B24_V010_RESTORED_CLEAN_BASELINE.html`。

          该 HTML 与仓库冻结 V010 文件逐字节相同。完整 B24 飞机是主对象。Ridged Noise 只保留为局部表面工具层。带有机身黑色污染带的本地 V011R1 预览已经排除，也没有收入本交付包。

          本次真实 Chromium QA 已验证飞机、局部表面层、保护组、螺旋桨动态、页面错误和 Console 错误。所有视觉、表面、历史、工程、整机和生产批准继续为 false。
          EOF

          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          out = Path(os.environ['DIST_ROOT'])
          scope = json.loads((out / 'evidence/fresh/B24_V011_RECOVERY_SCOPE.json').read_text(encoding='utf-8'))
          files = []
          for path in sorted(out.rglob('*')):
              if path.is_file():
                  data = path.read_bytes()
                  files.append({
                      'path': path.relative_to(out).as_posix(),
                      'bytes': len(data),
                      'sha256': hashlib.sha256(data).hexdigest(),
                  })
          receipt = {
              'schema': 'haihao.aircraft/b24-v011-recovery-delivery@1.0.0',
              'repository': 'haihao0307/AIRCRAFT',
              'branch': os.environ.get('GITHUB_REF_NAME'),
              'commit': os.environ.get('GITHUB_SHA'),
              'status': scope['status'],
              'visualBaselineRestored': True,
              'propellerMotionQaPassed': True,
              'rejectedLocalV011R1Excluded': True,
              'exactHtmlSha256': scope['exactHtmlSha256'],
              'productionApproved': False,
              'files': files,
          }
          (out / 'records/RECOVERY_DELIVERY_RECEIPT.json').write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY
          find "$DIST_ROOT" -type f -print0 | sort -z | xargs -0 sha256sum > "$DIST_ROOT/records/SHA256SUMS.txt"
          cd dist
          zip -q -r -9 AIRCRAFT_B24_V011_RECOVERED_TO_V010_CLEAN_BASELINE_R5.zip AIRCRAFT_B24_V011_RECOVERED_TO_V010_CLEAN_BASELINE_R5
          sha256sum AIRCRAFT_B24_V011_RECOVERED_TO_V010_CLEAN_BASELINE_R5.zip > AIRCRAFT_B24_V011_RECOVERED_TO_V010_CLEAN_BASELINE_R5.zip.sha256

      - name: Upload recovered B24 V010 delivery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AIRCRAFT_B24_V011_RECOVERED_TO_V010_CLEAN_BASELINE_R5-${{ github.sha }}
          path: |
            dist/AIRCRAFT_B24_V011_RECOVERED_TO_V010_CLEAN_BASELINE_R5.zip
            dist/AIRCRAFT_B24_V011_RECOVERED_TO_V010_CLEAN_BASELINE_R5.zip.sha256
            dist/AIRCRAFT_B24_V011_RECOVERED_TO_V010_CLEAN_BASELINE_R5/v010_exact/B24_V010_RESTORED_CLEAN_BASELINE.html
            dist/AIRCRAFT_B24_V011_RECOVERED_TO_V010_CLEAN_BASELINE_R5/evidence/frozen/B24_V010_CLEAN_FULL_SERVICE.png
            dist/AIRCRAFT_B24_V011_RECOVERED_TO_V010_CLEAN_BASELINE_R5/evidence/fresh/B24_V010_RECOVERY_FULL_SERVICE_PAGE.png
            dist/AIRCRAFT_B24_V011_RECOVERED_TO_V010_CLEAN_BASELINE_R5/evidence/fresh/B24_V010_RECOVERY_FULL_SERVICE.png
            dist/AIRCRAFT_B24_V011_RECOVERED_TO_V010_CLEAN_BASELINE_R5/evidence/fresh/B24_V011_RESTORE_V010_EXACT_QA.json
            dist/AIRCRAFT_B24_V011_RECOVERED_TO_V010_CLEAN_BASELINE_R5/evidence/fresh/B24_V011_RECOVERY_SCOPE.json
            dist/AIRCRAFT_B24_V011_RECOVERED_TO_V010_CLEAN_BASELINE_R5/records/RECOVERY_DELIVERY_RECEIPT.json
          if-no-files-found: error
          retention-days: 90

      - name: Write final recovery summary
        if: always()
        shell: bash
        run: |
          {
            echo '## B24 V010 clean aircraft recovery R5'
            echo
            echo "Branch: $GITHUB_REF_NAME"
            echo
            echo "Commit: $GITHUB_SHA"
            echo
            echo 'Exact frozen V010 restored. Polluted local V011R1 excluded.'
            echo
            echo 'HTML SHA256: 1b5b860ca78a7d55ea25d0d972a1d323125a57982d09452e7f7e0cb55d64a949'
            echo
            if [ -f "$EVIDENCE_ROOT/B24_V011_RECOVERY_SCOPE.json" ]; then
              cat "$EVIDENCE_ROOT/B24_V011_RECOVERY_SCOPE.json"
            fi
            echo
            if [ -f dist/AIRCRAFT_B24_V011_RECOVERED_TO_V010_CLEAN_BASELINE_R5.zip.sha256 ]; then
              cat dist/AIRCRAFT_B24_V011_RECOVERED_TO_V010_CLEAN_BASELINE_R5.zip.sha256
            fi
          } >> "$GITHUB_STEP_SUMMARY"
