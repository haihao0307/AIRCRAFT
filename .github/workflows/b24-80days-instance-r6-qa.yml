name: B24 80 DAYS instance R6 QA
on:
  push:
    branches: [feature/b24-80days-instance-from-mother01-r6]
    paths:
      - b24-80days-instance-r6.html
      - runtime/b24-80days-instance-r6.js
      - .github/workflows/b24-80days-instance-r6-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static check
        run: node --check runtime/b24-80days-instance-r6.js
      - name: Install Chromium
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Serve
        run: python -m http.server 8765 >/tmp/r6-http.log 2>&1 &
      - name: Browser and fixed-view QA
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from playwright.sync_api import sync_playwright
          out=Path('reports/80-days-r6-qa');out.mkdir(parents=True,exist_ok=True)
          desktop_errors=[];mobile_errors=[]
          with sync_playwright() as p:
              b=p.chromium.launch(headless=True)
              page=b.new_page(viewport={"width":1440,"height":900},device_scale_factor=1)
              page.on('console',lambda m: desktop_errors.append('console '+m.type+': '+m.text) if m.type=='error' else None)
              page.on('pageerror',lambda e: desktop_errors.append('pageerror: '+str(e)))
              page.goto('http://127.0.0.1:8765/b24-80days-instance-r6.html',wait_until='domcontentloaded',timeout=30000)
              page.wait_for_function("() => window.__B24_80DAYS_R6__ || window.__B24_80DAYS_R6_ERROR__",timeout=60000)
              state=page.evaluate("() => ({audit:window.__B24_80DAYS_R6__||null,error:window.__B24_80DAYS_R6_ERROR__||null,status:document.querySelector('#status')?.textContent,qa:document.querySelector('#qaReadout')?.textContent,loading:getComputedStyle(document.querySelector('#loading')).display})")
              for name in ['nose-port','port','front','orbit']:
                  page.click(f'button[data-view="{name}"]');page.wait_for_timeout(800);page.screenshot(path=str(out/f'{name}.png'))
              mobile=b.new_page(viewport={"width":390,"height":844},device_scale_factor=1)
              mobile.on('console',lambda m: mobile_errors.append('console '+m.type+': '+m.text) if m.type=='error' else None)
              mobile.on('pageerror',lambda e: mobile_errors.append('pageerror: '+str(e)))
              mobile.goto('http://127.0.0.1:8765/b24-80days-instance-r6.html',wait_until='domcontentloaded',timeout=30000)
              mobile.wait_for_function("() => window.__B24_80DAYS_R6__ || window.__B24_80DAYS_R6_ERROR__",timeout=60000)
              mobile_state=mobile.evaluate("() => ({error:window.__B24_80DAYS_R6_ERROR__||null,loading:getComputedStyle(document.querySelector('#loading')).display,canvas:[document.querySelector('#scene')?.clientWidth,document.querySelector('#scene')?.clientHeight],toggle:getComputedStyle(document.querySelector('#mobileToggle')).display})")
              mobile.screenshot(path=str(out/'mobile-390x844.png'))
              Path(out/'state.json').write_text(json.dumps({'desktop':state,'desktopErrors':desktop_errors,'mobile':mobile_state,'mobileErrors':mobile_errors},ensure_ascii=False,indent=2),encoding='utf-8')
              b.close()
          assert not state['error'],state
          a=state['audit']
          assert a['mother']['id']=='b24-generic-mother-01' and a['mother']['modified'] is False,a
          assert a['evidence']['photoPixels']==[2000,1243],a
          assert a['evidence']['teethRecovered']>=10,a
          assert a['evidence']['diceFacesRecovered']==6,a
          assert a['evidence']['dicePipContoursRecovered']==14,a
          assert a['evidence']['robbyPathsRecovered']>=6,a
          assert a['evidence']['huffPathsRecovered']>=5,a
          assert a['mapping']['singleSharedCoordinateSystem'] is True,a
          assert a['mapping']['raycastDecalGeometry'] is False,a
          assert a['mapping']['anchorStatus']=='provisional-not-identity-locked',a
          assert a['startupMs']<60000,a['startupMs']
          assert a['visualAcceptance'] is False and a['productionReady'] is False,a
          assert state['loading']=='none',state
          assert not desktop_errors,desktop_errors
          assert not mobile_state['error'],mobile_state
          assert mobile_state['loading']=='none',mobile_state
          assert mobile_state['canvas'][0]>0 and mobile_state['canvas'][1]>0,mobile_state
          assert mobile_state['toggle']!='none',mobile_state
          assert not mobile_errors,mobile_errors
          print(json.dumps({'qa':state['qa'],'startupMs':a['startupMs'],'evidence':a['evidence'],'mapping':a['mapping'],'mobile':mobile_state},ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b24-80days-instance-r6-qa
          path: reports/80-days-r6-qa
          retention-days: 30
