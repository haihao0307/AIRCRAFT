name: B24 V012 propeller interface and skin audit R3

on:
  push:
    branches:
      - feature/b24-v012-propeller-interface-skin-audit
    paths:
      - 'handoff/2026-08-29-b24-v012-propeller-interface-skin-audit/**'
      - 'data/b24-native/surface-modules/B24_SOURCE_DRIVEN_WEATHERING_CONTRACT_V001.json'
      - 'docs/aircraft-pipeline/B24_V012_PROPELLER_INTERFACE_AND_SKIN_AUDIT.md'
      - 'tools/audit-b24-v012-propeller-skin-v2.mjs'
      - 'tools/qa_b24_v012_propeller_interface.py'
      - '.github/workflows/b24-v012-propeller-interface-skin-audit-r3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-preview-package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      V010_ROOT: handoff/2026-08-29-b24-v010-ridged-noise-v002/current_v010
      V012_ROOT: handoff/2026-08-29-b24-v012-propeller-interface-skin-audit
      DELIVERY_PARENT: delivery
      DELIVERY_NAME: AIRCRAFT_B24_V012_PROPELLER_INTERFACE_SKIN_AUDIT_R3
      DELIVERY_ROOT: delivery/AIRCRAFT_B24_V012_PROPELLER_INTERFACE_SKIN_AUDIT_R3
      EVIDENCE_ROOT: delivery/AIRCRAFT_B24_V012_PROPELLER_INTERFACE_SKIN_AUDIT_R3/evidence
      PREVIEW_ROOT: delivery/AIRCRAFT_B24_V012_PROPELLER_INTERFACE_SKIN_AUDIT_R3/preview
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify exact frozen inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(stat --format=%s "$V010_ROOT/B24_V010_RIDGED_LOCAL_DAMAGE_REVIEW.html")" = "12550988"
          echo '1b5b860ca78a7d55ea25d0d972a1d323125a57982d09452e7f7e0cb55d64a949  handoff/2026-08-29-b24-v010-ridged-noise-v002/current_v010/B24_V010_RIDGED_LOCAL_DAMAGE_REVIEW.html' | sha256sum --check
          test -f preview/b24-reference-exact/assets/chunks/manifest.json
          test -f "$V012_ROOT/B24_V012_PROPELLER_INTERFACE_PATCH.js"
          test -f data/b24-native/surface-modules/B24_SOURCE_DRIVEN_WEATHERING_CONTRACT_V001.json

      - name: Run repository validation before evidence generation
        shell: bash
        run: |
          set -euo pipefail
          npm run validate:80days:references
          npm run build:80days:count-sheet
          npm test
          npm run build

      - name: Prepare isolated delivery directory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$DELIVERY_ROOT"
          mkdir -p "$EVIDENCE_ROOT/source" "$EVIDENCE_ROOT/browser" "$PREVIEW_ROOT" "$DELIVERY_ROOT/contracts" "$DELIVERY_ROOT/docs" "$DELIVERY_ROOT/records"

      - name: Audit exact GLB, propeller source and source texture slots
        shell: bash
        run: |
          set -euo pipefail
          node tools/audit-b24-v012-propeller-skin-v2.mjs \
            --output "$EVIDENCE_ROOT/source/B24_V012_PROPELLER_INTERFACE_SKIN_AUDIT.json"

      - name: Generate self-contained V012 aircraft review page
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          source = Path(os.environ['V010_ROOT']) / 'B24_V010_RIDGED_LOCAL_DAMAGE_REVIEW.html'
          patch = Path(os.environ['V012_ROOT']) / 'B24_V012_PROPELLER_INTERFACE_PATCH.js'
          output = Path(os.environ['PREVIEW_ROOT']) / 'B24_V012_PROPELLER_INTERFACE_REVIEW.html'
          html = source.read_text(encoding='utf-8')
          patch_text = patch.read_text(encoding='utf-8')
          if '</body>' not in html:
              raise SystemExit('Frozen V010 HTML has no closing body tag')
          html = html.replace('</head>', '<link rel="icon" href="data:,">\n</head>', 1)
          head, tail = html.rsplit('</body>', 1)
          generated = f'{head}<script>\n{patch_text}\n</script>\n</body>{tail}'
          output.write_text(generated, encoding='utf-8')
          if 'B24_V012_PROPELLER_INTERFACE_SKIN_AUDIT_2026-08-29' not in generated:
              raise SystemExit('V012 patch marker missing')
          print(f'generated={output} bytes={output.stat().st_size}')
          PY

      - name: Install pinned real-browser QA dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Start V012 review page
        shell: bash
        run: |
          set -euo pipefail
          cd "$PREVIEW_ROOT"
          python -m http.server 8772 --bind 127.0.0.1 > "$GITHUB_WORKSPACE/b24-v012-r3-http.log" 2>&1 &
          echo $! > "$GITHUB_WORKSPACE/b24-v012-r3-http.pid"
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8772/B24_V012_PROPELLER_INTERFACE_REVIEW.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$GITHUB_WORKSPACE/b24-v012-r3-http.log"
          exit 1

      - name: Run real Chromium aircraft QA
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python tools/qa_b24_v012_propeller_interface.py \
            --source-html "$V010_ROOT/B24_V010_RIDGED_LOCAL_DAMAGE_REVIEW.html" \
            --generated-html "$PREVIEW_ROOT/B24_V012_PROPELLER_INTERFACE_REVIEW.html" \
            --output "$EVIDENCE_ROOT/browser" \
            --url http://127.0.0.1:8772/B24_V012_PROPELLER_INTERFACE_REVIEW.html \
            | tee b24-v012-r3-browser.log

      - name: Stop V012 review page
        if: always()
        shell: bash
        run: |
          if [ -f b24-v012-r3-http.pid ]; then
            kill "$(cat b24-v012-r3-http.pid)" 2>/dev/null || true
          fi

      - name: Enforce source, aircraft and browser gates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = Path(os.environ['EVIDENCE_ROOT'])
          source = json.loads((evidence / 'source/B24_V012_PROPELLER_INTERFACE_SKIN_AUDIT.json').read_text(encoding='utf-8'))
          browser = json.loads((evidence / 'browser/B24_V012_PROPELLER_INTERFACE_BROWSER_QA.json').read_text(encoding='utf-8'))
          assert source['status'] == 'PASS_AUDIT_ONLY'
          assert source['source']['sha256'] == '541c3dcfb98ab590cdb1bc90d6ddcdfe80bce2a4b937f3bccefab0c7efe8be0d'
          assert source['propellerInterface']['sourceAssemblyCount'] == 4
          assert source['propellerInterface']['sourceAssembliesStructurallyIdentical'] is True
          assert source['propellerInterface']['sourceConnectorPresentOnAllFour'] is True
          assert source['propellerInterface']['runtimeClassification']['rootCauseConfirmed'] is True
          assert browser['status'] == 'PASS_PREVIEW_ONLY'
          assert browser['totals'] == {'checks': 47, 'passed': 47, 'failed': 0}
          assert len(browser['connectorDetails']) == 4
          assert all(item['triangleCount'] == 1128 and item['alpha'] == 1 for item in browser['connectorDetails'])
          assert all(item['protectedFromRidged'] is True and item['damageZone'] == 0 for item in browser['connectorDetails'])
          assert browser['v012State']['sourcePayloadChanged'] is False
          assert browser['v012State']['geometryChanged'] is False
          assert browser['v012State']['animationChanged'] is False
          assert browser['v012State']['liveryIdentityChanged'] is False
          assert browser['v012State']['runwayFlightSequenceChanged'] is False
          assert browser['browser']['pageErrors'] == []
          assert browser['browser']['seriousConsoleErrors'] == []
          assert all(value is False for value in browser['approvalBoundary'].values())
          print('B24_V012_R3_ALL_GATES_PASS')
          PY
          echo '1b5b860ca78a7d55ea25d0d972a1d323125a57982d09452e7f7e0cb55d64a949  handoff/2026-08-29-b24-v010-ridged-noise-v002/current_v010/B24_V010_RIDGED_LOCAL_DAMAGE_REVIEW.html' | sha256sum --check

      - name: Assemble versioned V012 delivery
        shell: bash
        run: |
          set -euo pipefail
          cp "$V012_ROOT/B24_V012_PROPELLER_INTERFACE_PATCH.js" "$DELIVERY_ROOT/contracts/"
          cp data/b24-native/surface-modules/B24_SOURCE_DRIVEN_WEATHERING_CONTRACT_V001.json "$DELIVERY_ROOT/contracts/"
          cp docs/aircraft-pipeline/B24_V012_PROPELLER_INTERFACE_AND_SKIN_AUDIT.md "$DELIVERY_ROOT/docs/"
          cp b24-v012-r3-browser.log "$DELIVERY_ROOT/records/"
          cp b24-v012-r3-http.log "$DELIVERY_ROOT/records/"
          cat > "$DELIVERY_ROOT/README_FIRST.md" <<'EOF'
          # B24 V012 螺旋桨连接件与蒙皮来源审计 R3

          打开：

          `preview/B24_V012_PROPELLER_INTERFACE_REVIEW.html`

          完整 B24 飞机保持主对象。四套源文件中已有的 1,128 三角形轮毂连接机构已经恢复可见。源载荷、几何、动画、80 DAYS 涂装身份以及跑道飞行动作系统均保持不变。

          噪波继续作为局部表面工具。排气油烟、机油渗漏、脚印、铆钉积污、板缝积污、雨水灰尘流痕、漆面褪色和边缘掉漆已经拆成来源驱动的独立层合同。

          所有视觉、表面、历史、工程、整机和生产批准继续关闭。
          EOF
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          out = Path(os.environ['DELIVERY_ROOT'])
          source = json.loads((out / 'evidence/source/B24_V012_PROPELLER_INTERFACE_SKIN_AUDIT.json').read_text(encoding='utf-8'))
          browser = json.loads((out / 'evidence/browser/B24_V012_PROPELLER_INTERFACE_BROWSER_QA.json').read_text(encoding='utf-8'))
          files = []
          for file_path in sorted(out.rglob('*')):
              if file_path.is_file():
                  data = file_path.read_bytes()
                  files.append({
                      'path': file_path.relative_to(out).as_posix(),
                      'bytes': len(data),
                      'sha256': hashlib.sha256(data).hexdigest(),
                  })
          receipt = {
              'schema': 'haihao.aircraft/b24-v012-propeller-interface-delivery@1.0.0',
              'repository': 'haihao0307/AIRCRAFT',
              'branch': os.environ.get('GITHUB_REF_NAME'),
              'commit': os.environ.get('GITHUB_SHA'),
              'status': 'PASS_PREVIEW_ONLY',
              'sourceGlbSha256': source['source']['sha256'],
              'sourceV010HtmlSha256': browser['source']['sha256'],
              'generatedPreviewSha256': browser['generatedPreview']['sha256'],
              'sourceConnectorPresentOnAllFour': True,
              'connectorVisibleOnAllFour': True,
              'browserChecks': browser['totals'],
              'normalTextureCount': source['sourceSkinAndTextureInventory']['textureSlots']['slotCounts']['normalTexture'],
              'semanticNameMatchCount': source['sourceSkinAndTextureInventory']['semanticNames']['matchCount'],
              'sourcePayloadChanged': False,
              'geometryChanged': False,
              'animationChanged': False,
              'liveryIdentityChanged': False,
              'runwayFlightSequenceChanged': False,
              'productionApproved': False,
              'files': files,
          }
          (out / 'records/B24_V012_DELIVERY_RECEIPT.json').write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY
          find "$DELIVERY_ROOT" -type f -print0 | sort -z | xargs -0 sha256sum > "$DELIVERY_ROOT/records/SHA256SUMS.txt"
          cd "$DELIVERY_PARENT"
          zip -q -r -9 "$DELIVERY_NAME.zip" "$DELIVERY_NAME"
          sha256sum "$DELIVERY_NAME.zip" > "$DELIVERY_NAME.zip.sha256"
          unzip -t "$DELIVERY_NAME.zip"

      - name: Upload V012 R3 delivery
        uses: actions/upload-artifact@v4
        with:
          name: AIRCRAFT_B24_V012_PROPELLER_INTERFACE_SKIN_AUDIT_R3-${{ github.sha }}
          path: |
            delivery/AIRCRAFT_B24_V012_PROPELLER_INTERFACE_SKIN_AUDIT_R3.zip
            delivery/AIRCRAFT_B24_V012_PROPELLER_INTERFACE_SKIN_AUDIT_R3.zip.sha256
            delivery/AIRCRAFT_B24_V012_PROPELLER_INTERFACE_SKIN_AUDIT_R3/preview/B24_V012_PROPELLER_INTERFACE_REVIEW.html
            delivery/AIRCRAFT_B24_V012_PROPELLER_INTERFACE_SKIN_AUDIT_R3/evidence/source/B24_V012_PROPELLER_INTERFACE_SKIN_AUDIT.json
            delivery/AIRCRAFT_B24_V012_PROPELLER_INTERFACE_SKIN_AUDIT_R3/evidence/browser/B24_V012_PROPELLER_INTERFACE_BROWSER_QA.json
            delivery/AIRCRAFT_B24_V012_PROPELLER_INTERFACE_SKIN_AUDIT_R3/evidence/browser/B24_V012_FULL_PAGE.png
            delivery/AIRCRAFT_B24_V012_PROPELLER_INTERFACE_SKIN_AUDIT_R3/evidence/browser/B24_V012_FULL_AIRCRAFT_NOISE_OFF.png
            delivery/AIRCRAFT_B24_V012_PROPELLER_INTERFACE_SKIN_AUDIT_R3/evidence/browser/B24_V012_FULL_AIRCRAFT_SERVICE.png
            delivery/AIRCRAFT_B24_V012_PROPELLER_INTERFACE_SKIN_AUDIT_R3/evidence/browser/B24_V012_PROP0_HUB_CONNECTOR.png
            delivery/AIRCRAFT_B24_V012_PROPELLER_INTERFACE_SKIN_AUDIT_R3/evidence/browser/B24_V012_PROP1_HUB_CONNECTOR.png
            delivery/AIRCRAFT_B24_V012_PROPELLER_INTERFACE_SKIN_AUDIT_R3/evidence/browser/B24_V012_PROP2_HUB_CONNECTOR.png
            delivery/AIRCRAFT_B24_V012_PROPELLER_INTERFACE_SKIN_AUDIT_R3/evidence/browser/B24_V012_PROP3_HUB_CONNECTOR.png
            delivery/AIRCRAFT_B24_V012_PROPELLER_INTERFACE_SKIN_AUDIT_R3/evidence/browser/B24_V012_PROPELLER_LIVE.png
            delivery/AIRCRAFT_B24_V012_PROPELLER_INTERFACE_SKIN_AUDIT_R3/records/B24_V012_DELIVERY_RECEIPT.json
          if-no-files-found: error
          retention-days: 90

      - name: Write final V012 summary
        if: always()
        shell: bash
        run: |
          {
            echo '## B24 V012 propeller interface and skin audit R3'
            echo
            echo "Branch: $GITHUB_REF_NAME"
            echo
            echo "Commit: $GITHUB_SHA"
            echo
            if [ -f "$EVIDENCE_ROOT/source/B24_V012_PROPELLER_INTERFACE_SKIN_AUDIT.json" ]; then
              python - <<'PY'
          import json, os
          from pathlib import Path
          source = json.loads((Path(os.environ['EVIDENCE_ROOT']) / 'source/B24_V012_PROPELLER_INTERFACE_SKIN_AUDIT.json').read_text())
          print(f"Source connector present on all four: {source['propellerInterface']['sourceConnectorPresentOnAllFour']}")
          print(f"Dedicated normalTexture count: {source['sourceSkinAndTextureInventory']['textureSlots']['slotCounts']['normalTexture']}")
          print(f"Rivet/panel semantic name matches: {source['sourceSkinAndTextureInventory']['semanticNames']['matchCount']}")
          PY
            fi
            if [ -f "$EVIDENCE_ROOT/browser/B24_V012_PROPELLER_INTERFACE_BROWSER_QA.json" ]; then
              python - <<'PY'
          import json, os
          from pathlib import Path
          browser = json.loads((Path(os.environ['EVIDENCE_ROOT']) / 'browser/B24_V012_PROPELLER_INTERFACE_BROWSER_QA.json').read_text())
          print(f"Browser QA: {browser['status']} {browser['totals']}")
          PY
            fi
            if [ -f "$DELIVERY_PARENT/$DELIVERY_NAME.zip.sha256" ]; then
              cat "$DELIVERY_PARENT/$DELIVERY_NAME.zip.sha256"
            fi
            echo
            echo 'All approval gates remain false.'
          } >> "$GITHUB_STEP_SUMMARY"
