name: B24 80 DAYS R11 pinned public QA
on:
  push:
    branches: [feature/b24-80days-scan-calibration-r10]
    paths:
      - .github/workflows/b24-80days-r11-public-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PUBLIC_URL: https://rawcdn.githack.com/haihao0307/AIRCRAFT/f9fafed1d7b84b932193ee68ee02eed407901cd1/b24-80days-r11-review.html
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium
        run: |
          python -m pip install playwright==1.55.0 pillow
          python -m playwright install --with-deps chromium
      - name: Verify pinned public R11 review
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from playwright.sync_api import sync_playwright
          import os,json
          url=os.environ['PUBLIC_URL']
          out=Path('reports/r11-public');out.mkdir(parents=True,exist_ok=True)
          errors=[]
          with sync_playwright() as p:
              b=p.chromium.launch(headless=True)
              page=b.new_page(viewport={'width':1728,'height':960},device_scale_factor=1)
              page.on('console',lambda m: errors.append('console '+m.type+': '+m.text) if m.type=='error' else None)
              page.on('pageerror',lambda e: errors.append('pageerror: '+str(e)))
              page.goto(url,wait_until='domcontentloaded',timeout=45000)
              iframe=page.frame_locator('iframe')
              iframe.locator('#scene').wait_for(state='visible',timeout=45000)
              frame=page.frames[-1]
              frame.wait_for_function('() => window.__B24_80DAYS_R11__ || window.__B24_80DAYS_R11_ERROR__',timeout=90000)
              state=frame.evaluate('() => ({audit:window.__B24_80DAYS_R11__||null,error:window.__B24_80DAYS_R11_ERROR__||null,status:document.querySelector("#status")?.textContent,loading:getComputedStyle(document.querySelector("#loading")).display})')
              page.screenshot(path=str(out/'review-public.png'))
              frame.locator('button[data-view="nose-port"]').click();page.wait_for_timeout(1200)
              page.screenshot(path=str(out/'nose-port-public.png'))
              Path(out/'state.json').write_text(json.dumps({'url':url,'state':state,'errors':errors},ensure_ascii=False,indent=2),encoding='utf-8')
              b.close()
          assert state.get('audit') and not state.get('error'),(state,errors)
          a=state['audit']
          assert a['mother']['modified'] is False,a
          assert a['sourceArtwork']['redrawn'] is False,a
          assert a['windowFrames']['mode']=='forward-port-frame-bands',a['windowFrames']
          assert a['windowFrames']['glassTransparent'] is True,a['windowFrames']
          assert state['loading']=='none',state
          assert not errors,errors
          im=Image.open(out/'review-public.png').convert('RGB')
          red=sum(1 for r,g,b in im.getdata() if r>65 and r>g*1.35 and r>b*1.15 and g<100)
          yellow=sum(1 for r,g,b in im.getdata() if r>120 and g>80 and r>b*1.7 and g>b*1.4)
          Path(out/'pixel-check.txt').write_text(f'red={red}\nyellow={yellow}\n',encoding='utf-8')
          assert red>15000,(red,yellow)
          assert yellow>1000,(red,yellow)
          print('PUBLIC_R11_OK',url,'red',red,'yellow',yellow)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b24-80days-r11-public-qa
          path: reports/r11-public
          retention-days: 30
