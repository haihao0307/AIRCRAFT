name: B24 panel evidence intake R1
on:
  workflow_dispatch:
  push:
    branches: [feature/b24-80days-texture-master-v2]
    paths: [.github/workflows/b24-panel-evidence-intake-r1.yml]
permissions:
  contents: read
jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Download explicitly listed public archival documents
        shell: python
        run: |
          import hashlib, json, pathlib, subprocess, urllib.parse
          root=pathlib.Path('b24-panel-evidence'); root.mkdir()
          base='https://archive.org/download/b-24-production-and-construction-analysis/'
          files=['B-24 Familiarization Training diagrams.pdf','B-24 Fuselage Cutaway diagram.pdf','B-24 Production and Construction Analysis_text.pdf']
          records=[]
          for name in files:
              url=base+urllib.parse.quote(name)
              path=root/name
              result=subprocess.run(['curl','--fail','--location','--retry','2','--connect-timeout','20','--max-time','90',url,'--output',str(path)],capture_output=True,text=True)
              data=path.read_bytes() if path.exists() else b''
              valid=result.returncode==0 and data.startswith(b'%PDF')
              records.append({'file':name,'url':url,'status':'acquired_unreviewed' if valid else 'download_failed','bytes':len(data),'sha256':hashlib.sha256(data).hexdigest() if valid else None,'detail':result.stderr[-1000:] if not valid else None,'targetVariantApplicability':'not_reviewed','productionApproved':False})
              if not valid and path.exists():path.unlink()
          (root/'INTAKE.json').write_text(json.dumps({'task':'B24_V018_readonly_panel_evidence_intake','records':records,'sourceModelChanged':False,'newSeamsCreated':False,'note':'Acquisition is not historical or geometric approval. Review each figure and its applicable variant before use.'},indent=2),encoding='utf8')
      - uses: actions/upload-artifact@v4
        with:
          name: B24-panel-evidence-unreviewed-r1
          path: b24-panel-evidence/
          retention-days: 30
