name: B24 80 DAYS R10 source-pixel QA
on:
  push:
    branches: [feature/b24-80days-scan-calibration-r10]
    paths:
      - b24-80days-instance-r10.html
      - b24-80days-r10-review.html
      - runtime/b24-80days-instance-r10.js
      - assets/80-days-port-master/**
      - .github/workflows/b24-80days-instance-r10-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static check
        run: node --check runtime/b24-80days-instance-r10.js
      - name: Install Chromium
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Serve
        run: python -m http.server 8765 >/tmp/r10-http.log 2>&1 &
      - name: Browser QA
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from playwright.sync_api import sync_playwright
          out=Path('reports/80-days-r10-qa');out.mkdir(parents=True,exist_ok=True)
          errors=[]
          with sync_playwright() as p:
              b=p.chromium.launch(headless=True)
              page=b.new_page(viewport={"width":1600,"height":950},device_scale_factor=1)
              page.on('console',lambda m: errors.append('console '+m.type+': '+m.text) if m.type=='error' else None)
              page.on('pageerror',lambda e: errors.append('pageerror: '+str(e)))
              page.goto('http://127.0.0.1:8765/b24-80days-instance-r10.html',wait_until='domcontentloaded',timeout=30000)
              page.wait_for_function("() => window.__B24_80DAYS_R10__",timeout=60000)
              state=page.evaluate("() => ({audit:window.__B24_80DAYS_R10__,loading:getComputedStyle(document.querySelector('#loading')).display,status:document.querySelector('#status')?.textContent})")
              page.screenshot(path=str(out/'instance-nose-port.png'),full_page=True)
              page.click('button[data-view="port"]');page.wait_for_timeout(800);page.screenshot(path=str(out/'instance-port.png'),full_page=True)
              review=b.new_page(viewport={"width":1600,"height":950},device_scale_factor=1)
              review.goto('http://127.0.0.1:8765/b24-80days-r10-review.html',wait_until='domcontentloaded',timeout=30000)
              review.wait_for_timeout(5000)
              review.screenshot(path=str(out/'review.png'),full_page=True)
              Path(out/'state.json').write_text(json.dumps({'state':state,'errors':errors},ensure_ascii=False,indent=2),encoding='utf-8')
              b.close()
          a=state['audit']
          assert a['mother']['id']=='b24-generic-mother-01' and a['mother']['modified'] is False,a
          assert a['sourceArtwork']['sha256']=='799e52d96a3427ef11272974a1f2a1318fa1d32102dce445e079691fe36c12c4',a
          assert a['sourceArtwork']['redrawn'] is False,a
          assert sorted(a['sourceArtwork']['components'])==['dice','mouth','robby','title'],a
          assert state['loading']=='none',state
          assert not errors,errors
          print(json.dumps(state,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b24-80days-r10-qa
          path: reports/80-days-r10-qa
          retention-days: 30
