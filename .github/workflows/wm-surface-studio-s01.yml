name: WM Surface Studio S01 build and WebGL review
on:
  push:
    branches: [feature/b24-weapons-mother-v1]
    paths:
      - experiments/weapons-surface-studio-s01/**
      - .github/workflows/wm-surface-studio-s01.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            experiments/weapons-surface-studio-s01
            src/mechanical-product-forge/knowledge-distillation
            data/weapons-mother/b24-m2-aircraft-v016
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and verify pinned renderer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor dist
          base=https://raw.githubusercontent.com/mrdoob/three.js/r170
          curl --fail --location --retry 2 "$base/build/three.module.js" -o vendor/three.module.js
          curl --fail --location --retry 2 "$base/examples/jsm/controls/OrbitControls.js" -o vendor/OrbitControls.js
          curl --fail --location --retry 2 "$base/LICENSE" -o vendor/THREE_LICENSE.txt
          printf '%s\n' 'ce1fa418de16a19495a9f72495580e3015d7745c296d3ce0485897f902ddedfb  three.module.js' '80efaadea4f8a636a65fb0bd08bfef62f3d93a0bb94e2e7500f23176c5c07f4e  OrbitControls.js' '4c40a1ef62450b857c3b2aaf294936304cd552d965fbcd9d32d4c5bcf4ba4454  THREE_LICENSE.txt' > vendor/SHA256SUMS
          (cd vendor && sha256sum -c SHA256SUMS)
      - name: Build isolated self-contained HTML
        shell: bash
        run: |
          python experiments/weapons-surface-studio-s01/build.py --source data/weapons-mother/b24-m2-aircraft-v016/distilled-reference.glb --vendor vendor --session src/mechanical-product-forge/knowledge-distillation/material-session.mjs --output dist/WEAPONS_MOTHER_SURFACE_STUDIO_S01.html
          cp -r experiments/weapons-surface-studio-s01 dist/source
          cp src/mechanical-product-forge/knowledge-distillation/material-session.mjs dist/source/material-session.mjs
          cp vendor/THREE_LICENSE.txt dist/THREE_LICENSE.txt
          cp -r vendor dist/vendor
          git rev-parse HEAD > dist/SOURCE_COMMIT.txt
          python -m py_compile experiments/weapons-surface-studio-s01/build.py experiments/weapons-surface-studio-s01/qa_browser.py
          node --check experiments/weapons-surface-studio-s01/studio.mjs
      - name: Install real browser test dependencies
        run: |
          python -m pip install playwright==1.55.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Actual WebGL desktop mobile and offline file checks
        run: python experiments/weapons-surface-studio-s01/qa_browser.py dist/WEAPONS_MOTHER_SURFACE_STUDIO_S01.html --output dist/qa
      - name: Upload review bundle even on test failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WM_SURFACE_STUDIO_S01_REVIEW_${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
