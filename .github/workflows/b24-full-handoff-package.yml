name: Build B24 full handoff package

on:
  push:
    branches:
      - research/b24-engineering-drawings-cad-v1
    paths:
      - 'handoff/2026-08-28-b24-*'
      - '.github/workflows/b24-full-handoff-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download and verify locked B24 reference source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/b24-source"
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 \
            --output "$RUNNER_TEMP/b24-source/b-24_liberator.glb" \
            https://github.com/haihao0307/AIRCRAFT/releases/download/80-days-source-v1/b-24_liberator.glb
          test "$(stat --format=%s "$RUNNER_TEMP/b24-source/b-24_liberator.glb")" = "23085972"
          echo "541c3dcfb98ab590cdb1bc90d6ddcdfe80bce2a4b937f3bccefab0c7efe8be0d  $RUNNER_TEMP/b24-source/b-24_liberator.glb" | sha256sum --check

      - name: Assemble full repository-side handoff
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/dist/AIRCRAFT_B24_DATA_NATIVE_GITHUB_HANDOFF_2026-08-28"
          rm -rf "$ROOT"
          mkdir -p "$ROOT/repository" "$ROOT/locked-source" "$ROOT/records"

          cp -a handoff "$ROOT/repository/"
          cp -a docs/aircraft-pipeline "$ROOT/repository/docs-aircraft-pipeline"
          cp -a data/aircraft-native "$ROOT/repository/data-aircraft-native"
          cp -a data/b24-engineering "$ROOT/repository/data-b24-engineering"
          cp -a data/b24-native "$ROOT/repository/data-b24-native"
          cp -a reports/b24-native "$ROOT/repository/reports-b24-native"
          cp -a scripts "$ROOT/repository/scripts"
          cp -a preview "$ROOT/repository/preview"
          cp -a .github/workflows "$ROOT/repository/workflows"
          cp -a AGENTS.md package.json "$ROOT/repository/"
          cp -a TASK_009_B24_ENGINEERING_DRAWINGS_AND_CAD_KNOWLEDGE_BASE.md "$ROOT/repository/"
          cp -a TASK_010_B24_MODULAR_ASSEMBLY_AND_VERTICAL_TAIL_PILOT.md "$ROOT/repository/"
          cp -a TASK_011_B24_REFERENCE_GLB_DISTILLATION_AND_SURFACE_MODULES.md "$ROOT/repository/"
          cp -a TASK_012_B24_REFERENCE_EXACT_MIRROR_AND_ANIMATION_DISTILLATION.md "$ROOT/repository/" || true
          cp -a TASK_012_B24_REFERENCE_FULL_MIRROR_AND_ANIMATION_DISTILLATION.md "$ROOT/repository/" || true
          cp -a TASK_013_AIRCRAFT_NATIVE_FORGE_DRAWING_FIRST_V1.md "$ROOT/repository/" || true
          cp -a TASK_013_AIRCRAFT_NATIVE_FORGE_FOUNDATION_AND_VERTICAL_TAIL_PILOT.md "$ROOT/repository/" || true
          cp "$RUNNER_TEMP/b24-source/b-24_liberator.glb" "$ROOT/locked-source/"

          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path(os.environ['GITHUB_WORKSPACE']) / 'dist' / 'AIRCRAFT_B24_DATA_NATIVE_GITHUB_HANDOFF_2026-08-28'
          head = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          branch = subprocess.check_output(['git','rev-parse','--abbrev-ref','HEAD'], text=True).strip()
          status = {
              'schema': 'haihao.aircraft/github-handoff-status@1.0.0',
              'repository': 'haihao0307/AIRCRAFT',
              'branch': branch,
              'head': head,
              'pullRequest': 14,
              'sourceLock': {
                  'file': 'b-24_liberator.glb',
                  'bytes': 23085972,
                  'sha256': '541c3dcfb98ab590cdb1bc90d6ddcdfe80bce2a4b937f3bccefab0c7efe8be0d'
              },
              'nextTask': 'handoff/2026-08-28-b24-data-native-next-task-v009.md'
          }
          (root / 'records' / 'GITHUB_STATUS.json').write_text(json.dumps(status, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          files = []
          for path in sorted(root.rglob('*')):
              if path.is_file():
                  payload = path.read_bytes()
                  files.append({
                      'path': path.relative_to(root).as_posix(),
                      'bytes': len(payload),
                      'sha256': hashlib.sha256(payload).hexdigest()
                  })
          manifest = {'schema':'haihao.aircraft/github-handoff-manifest@1.0.0','files':files}
          (root / 'records' / 'MANIFEST.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          cat > "$ROOT/README_FIRST.md" <<'EOF'
          # B24 数据原生飞机生产线 GitHub 全量交接包

          新对话先阅读：

          1. `repository/handoff/2026-08-28-b24-data-native-full-handoff.md`
          2. `repository/handoff/2026-08-28-b24-data-native-current-status.json`
          3. `repository/handoff/2026-08-28-b24-data-native-next-task-v009.md`
          4. `records/GITHUB_STATUS.json`
          5. `records/MANIFEST.json`

          工作只允许在 `research/b24-engineering-drawings-cad-v1` 与 Draft PR #14 中继续。
          EOF

          cd "$GITHUB_WORKSPACE/dist"
          zip -q -r -9 AIRCRAFT_B24_DATA_NATIVE_GITHUB_HANDOFF_2026-08-28.zip AIRCRAFT_B24_DATA_NATIVE_GITHUB_HANDOFF_2026-08-28
          sha256sum AIRCRAFT_B24_DATA_NATIVE_GITHUB_HANDOFF_2026-08-28.zip > AIRCRAFT_B24_DATA_NATIVE_GITHUB_HANDOFF_2026-08-28.zip.sha256

      - name: Upload complete handoff artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIRCRAFT_B24_DATA_NATIVE_GITHUB_HANDOFF_2026-08-28-${{ github.sha }}
          path: |
            dist/AIRCRAFT_B24_DATA_NATIVE_GITHUB_HANDOFF_2026-08-28.zip
            dist/AIRCRAFT_B24_DATA_NATIVE_GITHUB_HANDOFF_2026-08-28.zip.sha256
            dist/AIRCRAFT_B24_DATA_NATIVE_GITHUB_HANDOFF_2026-08-28/records/GITHUB_STATUS.json
            dist/AIRCRAFT_B24_DATA_NATIVE_GITHUB_HANDOFF_2026-08-28/records/MANIFEST.json
          if-no-files-found: error
          retention-days: 90

      - name: Write summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## B24 full handoff package created'
            echo
            echo "Branch: $GITHUB_REF_NAME"
            echo
            echo "HEAD: $GITHUB_SHA"
            echo
            echo 'Locked source bytes and SHA256: PASS'
            echo
            echo 'Handoff documents, data contracts, source registry, previews, reports, scripts and locked GLB are included.'
            echo
            cat dist/AIRCRAFT_B24_DATA_NATIVE_GITHUB_HANDOFF_2026-08-28.zip.sha256
          } >> "$GITHUB_STEP_SUMMARY"
