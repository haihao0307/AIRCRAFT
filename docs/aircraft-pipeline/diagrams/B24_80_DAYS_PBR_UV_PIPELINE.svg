<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">B-24 “80 DAYS” PBR and UV production pipeline</title>
  <desc id="desc">Non-destructive pipeline diagram from locked source model and historical references to reviewable texture maps.</desc>
  <defs>
    <style>
      .bg{fill:#f4f0e8}.box{fill:#fffdf8;stroke:#3f403b;stroke-width:3}.lock{fill:#d9c9a8}.uv{fill:#d9e5d3}.map{fill:#d7dbe9}.qa{fill:#ead6d2}.label{font-family:Arial,sans-serif;fill:#20211f}.h1{font-size:42px;font-weight:700}.h2{font-size:26px;font-weight:700}.txt{font-size:20px}.small{font-size:17px}.arrow{stroke:#3b3c38;stroke-width:5;fill:none;marker-end:url(#m)}
    </style>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3b3c38"/></marker>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="55" y="65" class="label h1">B-24J-25-CO “80 DAYS” non-destructive livery pipeline</text>
  <text x="55" y="102" class="label small">Fuselage and fixed vertical-fin paint only. Original geometry and original UV remain immutable.</text>

  <rect x="55" y="155" width="300" height="170" rx="18" class="box lock"/>
  <text x="82" y="200" class="label h2">1. LOCK INPUTS</text>
  <text x="82" y="238" class="label txt">Authoritative GLB</text>
  <text x="82" y="270" class="label txt">Byte + SHA-256 gate</text>
  <text x="82" y="302" class="label txt">E01–E08 references</text>

  <rect x="455" y="155" width="300" height="170" rx="18" class="box"/>
  <text x="482" y="200" class="label h2">2. CLASSIFY</text>
  <text x="482" y="238" class="label txt">Paintable fuselage</text>
  <text x="482" y="270" class="label txt">Fixed vertical fins</text>
  <text x="482" y="302" class="label txt">Exclude mechanisms</text>

  <rect x="855" y="155" width="300" height="170" rx="18" class="box uv"/>
  <text x="882" y="200" class="label h2">3. LIVERY UV</text>
  <text x="882" y="238" class="label txt">Preserve original UV</text>
  <text x="882" y="270" class="label txt">Unique port/starboard</text>
  <text x="882" y="302" class="label txt">Mission-state masks</text>

  <rect x="1255" y="155" width="290" height="170" rx="18" class="box qa"/>
  <text x="1282" y="200" class="label h2">4. UV QA</text>
  <text x="1282" y="238" class="label txt">Stretch + overlap</text>
  <text x="1282" y="270" class="label txt">Padding + mip safety</text>
  <text x="1282" y="302" class="label txt">Rivet continuity</text>

  <path d="M355 240 H450" class="arrow"/><path d="M755 240 H850" class="arrow"/><path d="M1155 240 H1250" class="arrow"/>

  <text x="55" y="405" class="label h2">5. PBR MAP SET</text>
  <rect x="55" y="440" width="280" height="210" rx="16" class="box map"/>
  <text x="82" y="485" class="label h2">BASE COLOR</text>
  <text x="82" y="525" class="label txt">Pigment + markings</text>
  <text x="82" y="557" class="label txt">Fading + touch-ups</text>
  <text x="82" y="589" class="label txt">Dirt and oil color</text>
  <text x="82" y="621" class="label small">No baked lighting</text>

  <rect x="365" y="440" width="280" height="210" rx="16" class="box map"/>
  <text x="392" y="485" class="label h2">NORMAL</text>
  <text x="392" y="525" class="label txt">Rivets + fasteners</text>
  <text x="392" y="557" class="label txt">Seams + patch edges</text>
  <text x="392" y="589" class="label txt">Restrained dents</text>
  <text x="392" y="621" class="label small">OpenGL unless overridden</text>

  <rect x="675" y="440" width="280" height="210" rx="16" class="box map"/>
  <text x="702" y="485" class="label h2">ROUGHNESS</text>
  <text x="702" y="525" class="label txt">Chalked paint</text>
  <text x="702" y="557" class="label txt">Oil + contact polish</text>
  <text x="702" y="589" class="label txt">Dry dust variation</text>
  <text x="702" y="621" class="label small">Linear data</text>

  <rect x="985" y="440" width="280" height="210" rx="16" class="box map"/>
  <text x="1012" y="485" class="label h2">HEIGHT / DISP</text>
  <text x="1012" y="525" class="label txt">Oil-canning</text>
  <text x="1012" y="557" class="label txt">Lap steps + patches</text>
  <text x="1012" y="589" class="label txt">Shallow dents</text>
  <text x="1012" y="621" class="label small">No silhouette change</text>

  <rect x="1295" y="440" width="250" height="210" rx="16" class="box map"/>
  <text x="1322" y="485" class="label h2">OPTIONAL</text>
  <text x="1322" y="525" class="label txt">AO</text>
  <text x="1322" y="557" class="label txt">Metallic</text>
  <text x="1322" y="589" class="label txt">ID masks</text>
  <text x="1322" y="621" class="label small">Follow runtime contract</text>

  <rect x="55" y="705" width="1490" height="135" rx="18" class="box qa"/>
  <text x="82" y="750" class="label h2">6. REVIEW GATES</text>
  <text x="82" y="790" class="label txt">Mission-state count sheet  •  Port and starboard screenshots  •  STAM window check  •  Tail check  •  Glancing-light rivet check  •  Runtime regression</text>
  <text x="82" y="820" class="label small">Any uncertain marking, unresolved mesh, mirrored island, source-lock failure or undocumented count blocks approval and merge.</text>
</svg>
