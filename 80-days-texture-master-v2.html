<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>B-24 “80 DAYS” 8K 涂装母版 V2</title><style>html,body{margin:0;height:100%;background:#07110f;color:#e8efe9;font-family:Inter,"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif}main{height:100%;display:grid;place-items:center;padding:24px}section{width:min(680px,100%);padding:28px;border:1px solid #30534a;border-radius:18px;background:#0c1b18;box-shadow:0 28px 90px #0008}small{color:#67d8b6;letter-spacing:.14em;font-weight:800}h1{font-size:clamp(26px,5vw,44px);margin:8px 0 12px}p{color:#a4b8b1;line-height:1.7}.bar{height:8px;background:#152a25;border-radius:999px;overflow:hidden;margin-top:18px}.bar i{display:block;height:100%;width:15%;background:#66d8b6;animation:load 1.15s infinite ease-in-out}@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(670%)}}.error{color:#f3a79b;white-space:pre-wrap}</style></head><body><main><section><small>HAIHAO AIRCRAFT · HISTORICAL LIVERY MASTER</small><h1>正在载入 “80 DAYS” 涂装母版</h1><p id="status">读取 8K 可审阅贴图工作台。页面将显示左右舷独立涂装、窗框、铆钉、板缝、检修盖、旧化、战损推断层、UV 和 PBR 通道。</p><div class="bar"><i></i></div></section></main><script>(async()=>{try{const count=5;const parts=[];for(let i=0;i<count;i++){const u=`./assets/livery/80-days/texture-master-v2/payload-${String(i).padStart(2,'0')}.txt`;const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(`${u} HTTP ${r.status}`);parts.push((await r.text()).trim())}const s=parts.join('');const bytes=Uint8Array.from(atob(s),c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.querySelector('.bar').remove();const n=document.getElementById('status');n.className='error';n.textContent='载入失败：'+(e?.stack||e)}})();</script></body></html>
