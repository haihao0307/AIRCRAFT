name: Validate
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install texture renderer
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Verify Release evidence and generate production assets
        run: |
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 --output "$RUNNER_TEMP/374BS_80_DAYS_review_pack_v2.zip" \
            https://github.com/haihao0307/AIRCRAFT/releases/download/80-days-source-v1/374BS_80_DAYS_review_pack_v2.zip
          node scripts/validate-80-days-references.mjs \
            --zip="$RUNNER_TEMP/374BS_80_DAYS_review_pack_v2.zip"
          npm run build:80days:model-audit
          npm run build:80days:pbr
      - run: npm test
      - run: npm run build
