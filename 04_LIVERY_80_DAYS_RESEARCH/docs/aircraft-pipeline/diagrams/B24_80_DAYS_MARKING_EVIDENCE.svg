<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">B-24 “80 DAYS” side-specific marking evidence</title>
  <desc id="desc">Schematic position zones only. It is not an aircraft geometry reference.</desc>
  <defs>
    <style>
      .bg{fill:#f4f0e8}.panel{fill:#fffdf8;stroke:#4b4a43;stroke-width:3}.skin{fill:#6e6a4f;stroke:#292a26;stroke-width:4}.gray{fill:#707477}.white{fill:#f6f3e9}.red{fill:#7f211c}.blue{fill:#273b4f}.gold{fill:#d2a72c}.label{font-family:Arial,sans-serif;fill:#222}.h1{font-size:42px;font-weight:700}.h2{font-size:28px;font-weight:700}.txt{font-size:22px}.small{font-size:18px}.line{stroke:#222;stroke-width:3}.dash{stroke:#555;stroke-width:2;stroke-dasharray:10 8;fill:none}
    </style>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text x="60" y="65" class="label h1">B-24J-25-CO “80 DAYS” marking evidence schematic</text>
  <text x="60" y="102" class="label small">Position zones only. Use the authoritative source model for geometry and panel coordinates.</text>

  <rect x="45" y="135" width="1510" height="305" rx="18" class="panel"/>
  <text x="75" y="178" class="label h2">PORT SIDE</text>
  <path class="skin" d="M120 285 Q145 220 240 218 L1320 218 Q1430 220 1490 285 Q1430 350 1320 352 L240 352 Q145 350 120 285Z"/>
  <path class="gray" d="M132 315 Q170 352 250 352 L1320 352 Q1405 350 1465 315 L1465 342 Q1400 382 1320 382 L240 382 Q160 380 132 345Z"/>
  <path class="red" d="M138 299 Q190 275 320 292 L410 332 Q245 358 155 329Z"/>
  <path class="white" d="M150 300 l26 30 24-36 24 34 25-33 24 33 26-31 24 31 24-26"/>
  <text x="330" y="284" class="label h2 white">“80 DAYS”</text>
  <rect x="440" y="302" width="46" height="46" class="white"/><rect x="500" y="302" width="46" height="46" class="white"/>
  <text x="205" y="257" class="label txt white">ROBBY</text>
  <text x="545" y="246" class="label txt white">HUFF</text>
  <g transform="translate(600 230)"><rect width="28" height="20" class="white"/><circle cx="14" cy="10" r="6" fill="#b42122"/><rect x="36" width="28" height="20" class="white"/><circle cx="50" cy="10" r="6" fill="#b42122"/></g>
  <g transform="translate(690 226)" fill="#d2a72c"><path d="M0 0h12v28H0zM-3 0h18l-4-8H1z"/><path d="M24 0h12v28H24zM21 0h18l-4-8H25z"/><path d="M48 0h12v28H48zM45 0h18l-4-8H49z"/></g>
  <g transform="translate(1020 270)"><circle r="48" class="blue"/><path class="white" d="M0-40 10-13 39-13 16 5 25 34 0 17-25 34-16 5-39-13-10-13Z"/></g>
  <text x="1320" y="255" class="label txt white">273257</text><text x="1358" y="284" class="label txt white">487</text><path class="white" d="M1370 300 l-26 44 h52z"/>
  <text x="80" y="420" class="label small">Confirmed port: shark mouth, title, dice, ROBBY, HUFF, symbol rows. STAM is absent from current port evidence.</text>

  <rect x="45" y="470" width="1510" height="305" rx="18" class="panel"/>
  <text x="75" y="513" class="label h2">STARBOARD SIDE</text>
  <path class="skin" d="M110 620 Q170 555 280 553 L1360 553 Q1460 555 1490 620 Q1460 685 1360 687 L280 687 Q170 685 110 620Z"/>
  <path class="gray" d="M130 650 Q190 687 280 687 L1360 687 Q1440 684 1473 650 L1473 680 Q1425 718 1360 718 L280 718 Q180 715 130 680Z"/>
  <path class="red" d="M1190 632 Q1320 610 1470 628 L1452 669 Q1305 690 1195 664Z"/>
  <text x="1060" y="618" class="label h2 white">“80 DAYS”</text>
  <rect x="1178" y="638" width="46" height="46" class="white"/><rect x="1238" y="638" width="46" height="46" class="white"/>
  <text x="1360" y="590" class="label txt white">ROBBY</text>
  <g transform="translate(880 570)"><rect width="28" height="20" class="white"/><circle cx="14" cy="10" r="6" fill="#b42122"/><rect x="36" width="28" height="20" class="white"/><circle cx="50" cy="10" r="6" fill="#b42122"/></g>
  <g transform="translate(970 566)" fill="#d2a72c"><path d="M0 0h12v28H0zM-3 0h18l-4-8H1z"/><path d="M24 0h12v28H24zM21 0h18l-4-8H25z"/><path d="M48 0h12v28H48zM45 0h18l-4-8H49z"/></g>
  <rect x="910" y="610" width="75" height="52" rx="5" fill="#303235" stroke="#d0cec3" stroke-width="4"/>
  <text x="920" y="690" class="label txt white">STAM</text>
  <line x1="947" y1="668" x2="947" y2="681" class="line"/>
  <g transform="translate(520 605)"><circle r="48" class="blue"/><path class="white" d="M0-40 10-13 39-13 16 5 25 34 0 17-25 34-16 5-39-13-10-13Z"/></g>
  <text x="150" y="590" class="label txt white">273257</text><text x="188" y="619" class="label txt white">487</text><path class="white" d="M200 636 l-26 44 h52z"/>
  <text x="80" y="753" class="label small">Confirmed starboard: STAM directly below the upper rectangular side window. Symbol counts remain mission-state dependent.</text>

  <rect x="45" y="802" width="1510" height="60" rx="12" fill="#e2ddd1" stroke="#4b4a43" stroke-width="2"/>
  <text x="70" y="840" class="label txt">Japanese flag = one credited Japanese aircraft destroyed. Bomb silhouette = one completed bombing mission or sortie. Never merge counts across dates.</text>
</svg>
