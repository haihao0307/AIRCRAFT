name: Deploy UBANGI BAG III V1 test site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/ubangi-v1-pages.yml'
      - 'public/assets/livery/ubangi-bag-iii/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ubangi-v1-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
